      ${UPD?setRow('version','⬇️','App version',UP.cur?esc(UP.cur.versionName)+(UP.next?' · update ready':''):''):''}
      ${setRow('data','🗂️','Data',prevSnap()?'Undo available':'')}</div>`}},
  look:{title:'Appearance',parent:'main',html:()=>{const tp=themePref();return`<div class="form">
    <div class="field"><span class="flabel">Theme</span><div class="chips" role="group">${[['auto','Match phone'],['light','Light'],['dark','Dark']].map(([k,l])=>`<button class="chip${tp===k?' on':''}" data-act="themeset" data-id="${k}" aria-pressed="${tp===k}">${l}</button>`).join('')}</div>
      <span class="sub">The ${isDark()?'sun':'moon'} button at the top also switches it.</span></div>
    <div class="field"><span class="flabel">Text size</span>${choice('text',[['sm','Small'],['md','Default'],['lg','Large'],['xl','Extra large']],S.cfg.text)}</div>
    <div class="field"><span class="flabel">Open Pitaka on</span>${choice('start',Object.entries(TABNAME),S.cfg.start)}</div></div>`}},
  format:{title:'Currency & format',parent:'main',html:()=>{const c=S.cfg;return`<div class="form">
    <div class="field"><span class="flabel">Currency symbol</span>${choice('cur',[['₱','₱'],['$','$'],['€','€'],['¥','¥'],['£','£'],['₩','₩'],['฿','฿'],['RM','RM'],['Rp','Rp'],['₹','₹']],c.cur)}
      <label>Or type your own<input id="cf_cur" maxlength="4" value="${esc(c.cur)}" data-nofocus></label></div>
    <div class="field"><span class="flabel">Amounts</span>${choice('dec',[[2,`${esc(c.cur)}1,234.50`],[0,`${esc(c.cur)}1,235`]],c.dec)}</div>
    <div class="field"><span class="flabel">Dates</span>${choice('date',[['md','Nov 7'],['dm','7 Nov']],c.date)}</div>
    <span class="sub">Only how amounts look changes. Your records keep their exact values.</span></div>`},
    bind:()=>{const i=$('#cf_cur');i.onchange=()=>{const v=i.value.trim();if(v){S.cfg.cur=v;save();applyCfg();render();settings()}}}},
  wallets:{title:'Wallets',parent:'main',html:()=>{const bal=balances();return`<div class="form">
    <span class="sub">Tap a wallet to rename it, set its starting balance, emoji or color, or hide it. Use the arrows to reorder.</span>
    <div class="setgroup">${S.wallets.map((w,i)=>`<div class="catrow"><button class="catmain" data-act="setpage" data-id="walletedit" data-arg="${w.id}">
      <span class="ic" style="--ic:var(--c${w.col})" aria-hidden="true">${esc(w.ic||w.name.charAt(0))}</span><span class="sl">${esc(w.name)}${w.hidden?' <span class="muted">· hidden</span>':''}</span>
      <span class="sv">${peso(bal[w.id]||0)}</span></button>
      <button class="icon-btn sm" data-act="listmove" data-l="wallets" data-id="${w.id}" data-k="-1" aria-label="Move ${esc(w.name)} up"${i?'':' disabled'}><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
      <button class="icon-btn sm" data-act="listmove" data-l="wallets" data-id="${w.id}" data-k="1" aria-label="Move ${esc(w.name)} down"${i<S.wallets.length-1?'':' disabled'}><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></div>`).join('')}</div>
    <button class="btn" data-act="setpage" data-id="walletedit" data-arg="new">+ Add wallet</button></div>`}},
  walletedit:{title:'Wallet',parent:'wallets',html:()=>{const id=STATE.setArg,w=id==='new'?{name:'',ic:'',col:(S.wallets.length%8)+1,init:0,hidden:false}:W(id);
    const n=id==='new'?0:S.tx.filter(t=>t.w===id||t.to===id).length,goal=S.goals.some(g=>g.w===id);
    return`<form class="form" id="weform">
    <label>Name<input id="we_n" value="${esc(w.name)}" placeholder="e.g. Maya, BPI Savings, Coin purse" required maxlength="40"></label>
    <label>Starting balance (${esc(CUR())})<input id="we_b" inputmode="decimal" value="${w.init||0}"></label><span class="sub" style="margin-top:-8px">What was in this wallet before your first record in Pitaka.</span>
    <div class="field"><span class="flabel">Emoji</span><div class="chips" id="we_ics">${['💵','🪙','📱','🏦','💳','🐷','👛','💼','🏠','✈️'].map(e=>`<button type="button" class="chip emo${e===w.ic?' on':''}" data-ic="${e}">${e}</button>`).join('')}</div>
      <label>Or type one<input id="we_i" value="${esc(w.ic||'')}" maxlength="8" placeholder="Leave empty to use the first letter"></label></div>
    <div class="field"><span class="flabel">Color</span><div class="swatches" id="we_cols">${[1,2,3,4,5,6,7,8].map(k=>`<button type="button" class="sw${k===w.col?' on':''}" data-col="${k}" style="--sw:var(--c${k})" aria-label="Color ${k}" aria-pressed="${k===w.col}"></button>`).join('')}</div></div>
    <div class="field"><span class="flabel">Show in lists</span><div class="chips" id="we_hid"><button type="button" class="chip${w.hidden?'':' on'}" data-h="0">Show</button><button type="button" class="chip${w.hidden?' on':''}" data-h="1">Hide</button></div>
      <span class="sub">Hidden wallets keep their history and still count in your totals; they just stop appearing in forms and on the Wallets tab.</span></div>
    <button class="btn pri" type="submit">${id==='new'?'Add wallet':'Save'}</button></form>
    ${id!=='new'?`<div class="form" style="margin-top:22px"><span class="flabel">Delete this wallet</span>${n||goal||S.wallets.length<2?`<span class="sub">${S.wallets.length<2?'You need at least one wallet.':n?`${n} record${n>1?'s use':' uses'} this wallet, so it can’t be deleted. Hide it instead.`:'A savings goal uses this wallet. Change the goal first.'}</span>`:`<button class="btn danger" type="button" id="we_del">Delete ${esc(w.name)}</button>`}</div>`:''}`},
    bind:()=>{const id=STATE.setArg,w=id==='new'?null:W(id);let col=w?w.col:(S.wallets.length%8)+1,hid=w?!!w.hidden:false;
      $('#we_ics').onclick=e=>{const b=e.target.closest('[data-ic]');if(!b)return;$('#we_i').value=b.dataset.ic;document.querySelectorAll('#we_ics .chip').forEach(x=>x.classList.toggle('on',x===b))};
      $('#we_cols').onclick=e=>{const b=e.target.closest('[data-col]');if(!b)return;col=+b.dataset.col;document.querySelectorAll('#we_cols .sw').forEach(x=>x.classList.toggle('on',x===b))};
      $('#we_hid').onclick=e=>{const b=e.target.closest('[data-h]');if(!b)return;hid=b.dataset.h==='1';document.querySelectorAll('#we_hid .chip').forEach(x=>x.classList.toggle('on',x===b))};
      $('#weform').onsubmit=e=>{e.preventDefault();const name=$('#we_n').value.trim();if(!name)return;const v=num($('#we_b').value);
        if(hid&&S.wallets.filter(x=>!x.hidden&&x.id!==id).length===0){toast('Keep at least one wallet visible.');return}
        const x=w||{id:'w'+uid()};Object.assign(x,{name,init:isNaN(v)?0:v,ic:$('#we_i').value.trim(),col,hidden:hid});if(!w)S.wallets.push(x);
        save();render();toast(w?'Saved':'Wallet added');settings('wallets','back')};
      const del=$('#we_del');if(del)del.onclick=()=>{snapshot('delete');S.wallets=S.wallets.filter(x=>x.id!==id);save();render();toast(`Deleted ${w.name}`,'undo','Undo');settings('wallets','back')}}},
  goals:{title:'Savings goals',parent:'main',html:()=>{const bal=balances();return`<div class="form">
    <span class="sub">Each goal tracks the balance of one wallet. Give it a target date to see how much to save each month.</span>
    ${S.goals.length?`<div class="setgroup">${S.goals.map(g=>`<button class="setrow" data-act="setpage" data-id="goaledit" data-arg="${g.id}"><span class="sic" aria-hidden="true">🎯</span><span class="sl">${esc(g.name)}</span><span class="sv">${pct(Math.max(0,bal[g.w]||0),g.amt)} of ${pesoS(g.amt)}</span>${CHEV}</button>`).join('')}</div>`:'<span class="sub">No goals yet.</span>'}
    <button class="btn" data-act="setpage" data-id="goaledit" data-arg="new">+ Add goal</button></div>`}},
  goaledit:{title:'Savings goal',parent:'goals',html:()=>{const id=STATE.setArg,g=id==='new'?{name:'',amt:'',w:wid('gotyme'),due:''}:S.goals.find(x=>x.id===id)||{name:'',amt:'',w:wid(''),due:''};
    return`<form class="form" id="geform">
    <label>Name<input id="ge_n" value="${esc(g.name)}" placeholder="e.g. Emergency fund, New phone, Christmas" required maxlength="40"></label>
    <div class="row2"><label>Target (${esc(CUR())})<input id="ge_a" inputmode="decimal" value="${g.amt||''}" required></label><label>Saved in<select id="ge_w">${wOpts(g.w)}</select></label></div>
    <label>Target date (optional)<input type="date" id="ge_d" value="${g.due||''}"></label>
    <button class="btn pri" type="submit">${id==='new'?'Add goal':'Save'}</button>${id!=='new'?`<button class="btn danger" type="button" id="ge_del">Delete goal</button>`:''}</form>`},
    bind:()=>{const id=STATE.setArg;
      $('#geform').onsubmit=e=>{e.preventDefault();const amt=num($('#ge_a').value);if(!(amt>0)){toast('Enter a target above zero.');return}
        const g=id==='new'?{id:'g'+uid()}:S.goals.find(x=>x.id===id);Object.assign(g,{name:$('#ge_n').value.trim()||'Savings goal',amt,w:$('#ge_w').value,due:$('#ge_d').value});
        if(id==='new')S.goals.push(g);save();render();toast(id==='new'?'Goal added':'Saved');settings('goals','back')};
      const del=$('#ge_del');if(del)del.onclick=()=>{snapshot('delete');S.goals=S.goals.filter(x=>x.id!==id);save();render();toast('Goal deleted','undo','Undo');settings('goals','back')}}},
  cards:{title:'Cards & pay later',parent:'main',html:()=>`<div class="form">
    <span class="sub">Set each card’s statement day and due day, and new charges get their due date filled in for you.</span>
    <div class="setgroup">${S.cards.map((c,i)=>{const k=S.cardCfg[c]||{};return`<button class="setrow" data-act="setpage" data-id="cardedit" data-arg="${i}"><span class="sic" aria-hidden="true">💳</span><span class="sl">${esc(c)}</span><span class="sv">${k.due?`${k.close?'Closes '+ord(k.close)+' · ':''}due ${ord(k.due)}`:'Days not set'}</span>${CHEV}</button>`}).join('')}</div>
    <button class="btn" data-act="setpage" data-id="cardedit" data-arg="new">+ Add card</button></div>`},
  cardedit:{title:'Card',parent:'cards',html:()=>{const i=STATE.setArg,name=i==='new'?'':S.cards[+i],k=S.cardCfg[name]||{},n=S.cc.filter(c=>c.card===name).length;
    const days=(sel,none)=>`<option value="">${none}</option>`+Array.from({length:31},(_,j)=>`<option value="${j+1}"${+sel===j+1?' selected':''}>${ord(j+1)}</option>`).join('');
    return`<form class="form" id="kdform">
    <label>Name<input id="kd_n" value="${esc(name)}" placeholder="e.g. BPI Mastercard, SPayLater, GGives" required maxlength="40"></label>
    <div class="row2"><label>Statement day<select id="kd_c">${days(k.close,'Not set')}</select></label><label>Due day<select id="kd_d">${days(k.due,'Not set')}</select></label></div>
    <span class="sub">Example: statement on the 25th and due on the 15th means a charge on May 20 is due June 15, and a charge on May 27 is due July 15.</span>
    <button class="btn pri" type="submit">${i==='new'?'Add card':'Save'}</button>
    ${i!=='new'&&S.cards.length>1?`<button class="btn danger" type="button" id="kd_del">Remove from list</button>${n?`<span class="sub">Its ${n} charge${n>1?'s stay':' stays'} in Debts.</span>`:''}`:''}</form>`},
    bind:()=>{const i=STATE.setArg,old=i==='new'?null:S.cards[+i];
      $('#kdform').onsubmit=e=>{e.preventDefault();const name=$('#kd_n').value.trim();if(!name)return;
        if(name!==old&&S.cards.includes(name)){toast('You already have a card with that name.');return}
        const cfg={close:+$('#kd_c').value||0,due:+$('#kd_d').value||0};
        if(old===null)S.cards.push(name);else if(name!==old){S.cards[+i]=name;S.cc.forEach(c=>{if(c.card===old)c.card=name});delete S.cardCfg[old]}
        S.cardCfg[name]=cfg;save();render();toast(old===null?'Card added':'Saved');settings('cards','back')};
      const del=$('#kd_del');if(del)del.onclick=()=>{S.cards.splice(+i,1);delete S.cardCfg[old];save();render();toast('Removed');settings('cards','back')}}},
  period:{title:'Month starts on',parent:'main',html:()=>`<div class="form">
    <span class="sub">Pick the day your money month begins, such as your payday. Totals, budgets, the forecast and the month-by-month table all follow it.</span>
    <div class="chips daychips" role="group">${Array.from({length:28},(_,i)=>i+1).map(d=>`<button class="chip${MS()===d?' on':''}" data-act="mstart" data-v="${d}" aria-pressed="${MS()===d}">${d}</button>`).join('')}</div>
    <span class="sub">${MS()===1?'Now: calendar months (Nov 1 – Nov 30).':`Now: ${pLabel(curP())}.`}</span></div>`},
  recur:{title:'Recurring entries',parent:'main',html:()=>`<div class="form">
    <span class="sub">Repeating entries are added on their date, the next time you open Pitaka. To make one, choose <b>Repeat</b> when adding an expense, income, transfer or card charge, or tell the assistant “netflix 549 every month”.</span>
    ${S.recur.length?`<div class="setgroup">${S.recur.map(r=>`<button class="setrow" data-act="setpage" data-id="recuredit" data-arg="${r.id}"><span class="sic" aria-hidden="true">${r.on?'🔁':'⏸️'}</span><span class="sl">${esc(ruleName(r))}</span><span class="sv">${peso(r.tpl.a)} · ${r.on?'next '+dLabel(r.next):'paused'}</span>${CHEV}</button>`).join('')}</div>`:'<span class="sub">None yet.</span>'}</div>`},
  recuredit:{title:'Repeating entry',parent:'recur',html:()=>{const r=S.recur.find(x=>x.id===STATE.setArg);if(!r)return'<span class="sub">This entry was removed.</span>';
    const kind={exp:'Expense',inc:'Income',xfer:'Transfer',cc:'Card charge'}[r.kind],made=S.tx.filter(t=>t.rec===r.id).length+S.cc.filter(c=>c.rec===r.id).length;
    return`<form class="form" id="reform"><span class="sub">${kind}${r.kind==='exp'?' · '+esc(catName(r.tpl.c)):''}${r.tpl.w?' · '+esc(W(r.tpl.w).name):''}${r.kind==='cc'?' · '+esc(r.tpl.card):''} · ${made} added so far</span>
    <label>Description<input id="re_s" value="${esc(r.tpl.s||'')}" maxlength="60"></label>
    <div class="row2"><label>Amount (${esc(CUR())})<input id="re_a" inputmode="decimal" value="${r.tpl.a}"></label><label>Repeats<select id="re_e">${Object.entries(EVERY).map(([k,l])=>`<option value="${k}"${r.every===k?' selected':''}>${l}</option>`).join('')}</select></label></div>
    <label>Next date<input type="date" id="re_n" value="${r.next}"></label>
    <div class="btns"><button class="btn pri" type="submit" style="flex:1">Save</button><button class="btn" type="button" id="re_p">${r.on?'Pause':'Resume'}</button></div>
    <button class="btn danger" type="button" id="re_del">Stop repeating</button><span class="sub">Entries already added stay in your records.</span></form>`},
    bind:()=>{const r=S.recur.find(x=>x.id===STATE.setArg);if(!r)return;
      $('#reform').onsubmit=e=>{e.preventDefault();const a=num($('#re_a').value);if(!(a>0)){toast('Enter an amount above zero.');return}
        Object.assign(r.tpl,{a,s:$('#re_s').value.trim()});r.every=$('#re_e').value;r.next=$('#re_n').value||r.next;r.day=+r.next.slice(8);save();runRecurring();render();toast('Saved');settings('recur','back')};
      $('#re_p').onclick=()=>{r.on=!r.on;save();toast(r.on?'Resumed':'Paused');settings()};
      $('#re_del').onclick=()=>{S.recur=S.recur.filter(x=>x.id!==r.id);save();render();toast('Stopped repeating');settings('recur','back')}}},
  shortcuts:{title:'Assistant shortcuts',parent:'main',html:()=>`<form class="form" id="shform">
    <span class="sub">One tap sends these to the assistant, which makes a draft you confirm. They appear above the message box and in the + menu. You can also tap <b>⚡ Save as shortcut</b> under any draft.</span>
    <label>One per line<textarea id="sh_l" rows="7" placeholder="jeep 13 cash
lunch 120 gcash
load 99 gcash" data-nofocus>${esc(S.cfg.shortcuts.join('\n'))}</textarea></label>
    <button class="btn pri" type="submit">Save</button></form>`,
    bind:()=>{$('#shform').onsubmit=e=>{e.preventDefault();S.cfg.shortcuts=[...new Set($('#sh_l').value.split('\n').map(x=>x.trim()).filter(Boolean))].slice(0,12);save();render();toast('Saved');settings('main','back')}}},
  lock:{title:'App lock',parent:'main',html:()=>{const c=lockCfg();return c?`<div class="form">
    <div class="field"><span class="flabel">Lock when I leave Pitaka</span>
      <div class="chips" role="group">${[[0,'Right away'],[60,'After 1 min'],[300,'After 5 min'],[900,'After 15 min']].map(([v,l])=>`<button class="chip${(c.after||0)===v?' on':''}" data-act="lockset" data-k="after" data-v="${v}">${l}</button>`).join('')}</div></div>
    ${LK.bioOK?`<div class="field"><span class="flabel">Unlock with fingerprint or face</span><div class="chips" role="group"><button class="chip${c.bio?' on':''}" data-act="lockset" data-k="bio" data-v="1">On</button><button class="chip${c.bio?'':' on'}" data-act="lockset" data-k="bio" data-v="0">Off</button></div>
      <span class="sub">Your phone’s own screen lock works here too, so you can still get in if you forget the PIN.</span></div>`:''}
    <div class="btns"><button class="btn" data-act="lockchange">Change PIN</button><button class="btn danger" data-act="lockoff">Turn off</button></div>
    <span class="sub">The PIN is stored only on this phone and is not part of your backups.${LK.bioOK?'':' If you forget it, the only way back in is to erase Pitaka on this phone and restore a backup, so keep a recent backup.'}</span></div>`
    :`<div class="form"><span class="sub">Ask for a PIN when Pitaka opens${BIO?', with fingerprint or face unlock if your phone has it':''}. It keeps people who pick up your phone out of your records. It is a privacy screen, not encryption.</span>
    <div class="btns"><button class="btn pri" data-act="lockon" data-v="4">Turn on with a 4-digit PIN</button><button class="btn" data-act="lockon" data-v="6">Use 6 digits</button></div>
    <span class="sub">${BIO?'':'If you forget the PIN, the only way back in is to erase Pitaka on this phone and restore a backup. Make a backup first.'}</span></div>`}},
  reminders:{title:'Reminders',parent:'main',html:()=>`<div class="form">
    <div class="field"><span class="flabel">Backup reminder</span>${choice('bkEvery',[[0,'Off'],[7,'Weekly'],[14,'Every 2 weeks'],[30,'Monthly']],S.cfg.bkEvery)}
      <span class="sub">Shows on Overview when your last backup is older than this.</span></div>
    <div class="field"><span class="flabel">Daily “log your spending” reminder</span>
      <div class="chips" role="group"><button class="chip${S.cfg.nudge.on?'':' on'}" data-act="nudgeon" data-v="0">Off</button><button class="chip${S.cfg.nudge.on?' on':''}" data-act="nudgeon" data-v="1">On</button></div>
      <label>Time<input type="time" id="nz_t" value="${S.cfg.nudge.time}" data-nofocus></label>
      <span class="sub">${LN?'A phone notification at this time on days you have not logged anything.':'On iPhone and in a browser, Pitaka cannot send notifications by itself. Instead, opening Pitaka after this time shows a reminder on Overview if nothing is logged yet today.'}</span></div></div>`,
    bind:()=>{const t=$('#nz_t');t.onchange=()=>{if(t.value){S.cfg.nudge.time=t.value;save();render()}}}},
  inctypes:{title:'Income types',parent:'main',html:()=>`<form class="form" id="itform">
    <label>One type per line<textarea id="it_l" rows="8" data-nofocus>${esc(S.incTypes.join('\n'))}</textarea></label>
    <span class="sub">These appear in the income form and the assistant understands them (“remittance 5000 gcash”). Renaming a type keeps old records as they are.</span>
    <button class="btn pri" type="submit">Save</button></form>`,
    bind:()=>{$('#itform').onsubmit=e=>{e.preventDefault();const l=[...new Set($('#it_l').value.split('\n').map(x=>x.trim()).filter(Boolean))];
      if(!l.length){toast('Keep at least one income type.');return}S.incTypes=l;save();render();toast('Saved');settings('main','back')}}},
  cats:{title:'Categories & budgets',parent:'main',html:()=>`<div class="form">
    <span class="sub">Tap a category to rename it, change its emoji or color, or set a monthly budget. Use the arrows to reorder.</span>
    <div class="setgroup">${S.cats.map((c,i)=>`<div class="catrow"><button class="catmain" data-act="setpage" data-id="catedit" data-arg="${c.id}">
      <span class="ic" style="--ic:${catCol(c.id)}" aria-hidden="true">${esc(c.ic||c.name.charAt(0))}</span><span class="sl">${esc(c.name)}</span>
      <span class="sv">${c.budget>0?peso(c.budget)+' / month':''}</span></button>
      <button class="icon-btn sm" data-act="catmove" data-id="${c.id}" data-k="-1" aria-label="Move ${esc(c.name)} up"${i?'':' disabled'}><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
      <button class="icon-btn sm" data-act="catmove" data-id="${c.id}" data-k="1" aria-label="Move ${esc(c.name)} down"${i<S.cats.length-1?'':' disabled'}><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></div>`).join('')}</div>
    <button class="btn" data-act="setpage" data-id="catedit" data-arg="new">+ Add category</button></div>`},
  catedit:{title:'Category',parent:'cats',html:()=>{const id=STATE.setArg,c=id==='new'?{name:'',ic:'',col:(S.cats.length%8)+1,budget:0}:catOf(id);
    const n=id==='new'?0:S.tx.filter(t=>t.t==='exp'&&t.c===id).length+S.cc.filter(c=>c.c===id).length,others=S.cats.filter(k=>k.id!==id);
    return`<form class="form" id="ceform">
    <label>Name<input id="ce_n" value="${esc(c.name)}" placeholder="e.g. Pets, Coffee, Baby" required maxlength="40"></label>

/* ================= app lock ================= */
/* A PIN (and on Android, fingerprint / face / the phone's screen lock) shown over the app when it opens and when it
   comes back after the chosen delay. The PIN is kept only on this phone, as a PBKDF2 hash with a random salt; it is
   never in backups, so restoring a backup elsewhere does not carry a PIN you might not know there. It is a privacy
   screen, not encryption: the records themselves are stored as before. */
const LOCK_KEY='pitaka.lock';
const lockCfg=()=>{try{const c=JSON.parse(localStorage.getItem(LOCK_KEY)||'null');return c&&c.hash?c:null}catch(e){return null}};
const BIO=(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()&&Capacitor.Plugins.Biometric)||null;
const LK={on:false,mode:'',entry:'',first:'',len:4,fails:0,until:0,hiddenAt:0,skip:false,msg:'',bioOK:false,done:null,forgot:0};
async function pinHash(pin,salt){const e=new TextEncoder(),k=await crypto.subtle.importKey('raw',e.encode(pin),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:e.encode(salt),iterations:150000,hash:'SHA-256'},k,256);
  return[...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('')}
// mode: unlock (app start/return), check (confirm current PIN before a change), set1/set2 (choose a new PIN)
function showLock(mode,done,len){const c=lockCfg();LK.on=true;LK.mode=mode;LK.entry='';LK.first=mode==='set2'?LK.first:'';LK.done=done||null;LK.forgot=0;
  LK.len=len||(c?c.len:4);LK.msg='';$('#lock').hidden=false;document.documentElement.classList.add('locked');drawLock();
  if(mode==='unlock'&&c&&c.bio&&LK.bioOK)setTimeout(bioUnlock,250)}
function hideLock(){LK.on=false;$('#lock').hidden=true;document.documentElement.classList.remove('locked')}
function drawLock(){const c=lockCfg(),wait=Math.max(0,Math.ceil((LK.until-Date.now())/1000));
  const title={unlock:'Enter your PIN',check:'Enter your current PIN',set1:`Choose a ${LK.len}-digit PIN`,set2:'Enter it again'}[LK.mode];
  const keys=['1','2','3','4','5','6','7','8','9',LK.mode==='unlock'&&c&&c.bio&&LK.bioOK?'bio':'','0','del'];
  $('#lock').innerHTML=`<div class="lockbox"><div class="lockic" aria-hidden="true">₱</div><h2>${title}</h2>
    <div class="dots${LK.msg==='wrong'?' shake':''}" aria-label="${LK.entry.length} of ${LK.len} digits">${Array.from({length:LK.len},(_,i)=>`<i class="${i<LK.entry.length?'on':''}"></i>`).join('')}</div>
    <p class="lockmsg">${wait?`Too many tries. Try again in ${wait} s.`:LK.msg==='wrong'?'Wrong PIN':LK.msg==='mismatch'?'The PINs did not match. Try again.':'&nbsp;'}</p>
    <div class="keypad">${keys.map(k=>k===''?'<span></span>':k==='del'?`<button class="key fn" data-act="lockkey" data-k="del" aria-label="Delete">⌫</button>`:k==='bio'?`<button class="key fn" data-act="lockbio" aria-label="Use fingerprint or face">◉</button>`:`<button class="key" data-act="lockkey" data-k="${k}"${wait?' disabled':''}>${k}</button>`).join('')}</div>
    ${LK.mode==='unlock'?`<button class="linkbtn" data-act="lockforgot">Forgot PIN?</button>`:`<button class="linkbtn" data-act="lockcancel">Cancel</button>`}
    ${LK.forgot?`<div class="forgot"><p>${LK.bioOK&&c&&c.bio?'Use the ◉ button to unlock with your fingerprint, face or phone screen lock.':'Without the PIN, the only way in is to erase Pitaka’s records on this phone and restore them from a backup.'}</p>
      ${LK.forgot===1?`<button class="btn danger" data-act="lockerase">Erase and start over</button>`:`<button class="btn danger" data-act="lockerase">Tap again to erase everything on this phone</button>`}</div>`:''}</div>`}
async function lockKey(k){if(Date.now()<LK.until)return;if(k==='del'){LK.entry=LK.entry.slice(0,-1);LK.msg='';drawLock();return}
  if(LK.entry.length>=LK.len)return;LK.entry+=k;LK.msg='';drawLock();if(LK.entry.length<LK.len)return;
  const pin=LK.entry,c=lockCfg();
  if(LK.mode==='set1'){LK.first=pin;showLock('set2',LK.done,LK.len);return}
  if(LK.mode==='set2'){if(pin!==LK.first){LK.first='';LK.mode='set1';LK.entry='';LK.msg='mismatch';drawLock();return}
    const salt=[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join('');
    const next={...(c||{after:0,bio:LK.bioOK}),salt,len:LK.len,hash:await pinHash(pin,salt)};
    try{localStorage.setItem(LOCK_KEY,JSON.stringify(next))}catch(e){toast('Could not save the PIN on this phone.');hideLock();return}
    hideLock();const d=LK.done;LK.done=null;if(d)d(true);return}
  if(!c){hideLock();return}
  if(await pinHash(pin,c.salt)===c.hash){LK.fails=0;hideLock();const d=LK.done;LK.done=null;if(d)d(true)}
  else{LK.fails++;LK.entry='';LK.msg='wrong';if(LK.fails>=5){LK.until=Date.now()+30000;LK.fails=0;const t=setInterval(()=>{if(!LK.on||Date.now()>=LK.until){clearInterval(t);LK.msg=''}if(LK.on)drawLock()},1000)}drawLock()}}
async function bioUnlock(){if(!BIO||!LK.on)return;try{const r=await BIO.verify({reason:'Unlock Pitaka'});if(r&&r.verified){LK.fails=0;hideLock();const d=LK.done;LK.done=null;if(d)d(true)}}catch(e){}}
function lockNow(){if(lockCfg()&&!LK.on)showLock('unlock')}
document.addEventListener('visibilitychange',()=>{const c=lockCfg();if(!c)return;
  if(document.visibilityState==='hidden'){LK.hiddenAt=Date.now();if(!c.after&&!LK.skip)lockNow()} // locked before the app-switcher snapshot
  else{if(LK.skip){LK.skip=false;return}if(Date.now()-LK.hiddenAt>=(c.after||0)*1000)lockNow()}});
// Leaving for a moment on purpose (share menu, file picker, installer) does not lock.
const awayOnPurpose=()=>{LK.skip=true;setTimeout(()=>LK.skip=false,120000)};

function draftCard(i){const x=STATE.drafts[i];if(!x)return'';if(x.done)return`<div class="draft"><span class="sub">${x.done}</span></div>`;
  const L={exp:'Expense',inc:'Income',xfer:'Transfer',lend:'Loan',repay:'Repayment',cc:'Card charge'}[x.t];
  const rp=x.every?` · repeats ${x.every==='week'?'weekly':'monthly'}`:'';
  const det=x.t==='exp'?`${catName(x.c)} · ${W(x.w).name}`:x.t==='xfer'?`${W(x.w).name} → ${W(x.to).name}`:x.t==='lend'?`to ${x.p} · from ${W(x.w).name}`:x.t==='repay'?`from ${x.p}${x.s?' for '+x.s:''} · into ${W(x.w).name}`:x.t==='cc'?`${catName(x.c)} · ${x.card}${x.pn?` · ${x.pn} months of ${peso(planAmounts(x.a,x.pn,0).each)}`:''}`:W(x.w).name;
  const opts=x.t==='exp'||x.t==='cc'?[...new Set([x.c,...(x.conf?x.conf.alts.filter(a=>a.p>=.08).map(a=>a.c):[]),...S.cats.map(c=>c.id)])].filter(id=>S.cats.some(c=>c.id===id)).slice(0,4):[];
  const sure=x.conf&&!x.picked?` · ✦ ${Math.round(x.conf.p*100)}% sure of category`:'';
  return`<div class="draft"><div class="split"><b>${L}${x.s&&x.t!=='repay'?': '+esc(x.s):''}</b><b class="mono">${peso(x.a)}</b></div><span class="sub">${esc(det)} · ${dLabel(x.d)}${rp}${x.tags?' · '+esc(tagStr(x.tags)):''}${sure}</span>${x.warn?`<span class="sub warn">${esc(x.warn)}</span>`:''}
  ${opts.length?`<div class="chips" role="group" aria-label="Category">${opts.map(c=>`<button class="chip${c===x.c?' on':''}" data-act="dcat" data-id="${i}" data-c="${c}" aria-pressed="${c===x.c}"><i class="dot" style="background:${catCol(c)}"></i>${esc(catName(c))}</button>`).join('')}</div>`:''}
  <div class="btns"><button class="btn sm pri" data-act="dsave" data-id="${i}">Add it</button><button class="btn sm" data-act="dedit" data-id="${i}">Edit</button><button class="btn sm" data-act="dskip" data-id="${i}">Discard</button>${x.raw&&!S.cfg.shortcuts.includes(x.raw)?`<button class="btn sm" data-act="dshort" data-id="${i}">⚡ Save as shortcut</button>`:''}</div></div>`}
function renderChips(){$('#aichips').innerHTML=S.cfg.shortcuts.map(q=>`<button class="chip sc" data-act="ask" data-q="${esc(q)}">⚡ ${esc(q)}</button>`).join('')+['Summary','Where did my money go?','Who owes me?','Forecast','Tips','Can I afford 2000?','Compare vs last month','Biggest expenses'].map(q=>`<button class="chip" data-act="ask" data-q="${q}">${q}</button>`).join('')}
function ask(text){text=text.trim();if(!text)return;STATE.chat.push({me:true,h:text,fresh:1});
  const isQ=RX.q.test(text.toLowerCase())&&!/^(lunch|dinner|breakfast)/i.test(text);const cmd=isQ?null:parseCommand(text);
  if(cmd){STATE.drafts.push(cmd);const i=STATE.drafts.length-1;
    STATE.chat.push({me:false,fresh:1,h:cmd.t!=='exp'?'Here is what I understood:':!cmd.conf?'I could not tell the category from that. Pick one below:':cmd.conf.p<.6?`My best guess is <b>${esc(catName(cmd.c))}</b> (${esc(cmd.conf.why)}), but I am not sure. Pick another below if it is wrong.`:`Got it. I filed this under <b>${esc(catName(cmd.c))}</b> (${esc(cmd.conf.why)}).`,draft:i})}
  else STATE.chat.push({me:false,fresh:1,h:answer(text)});
  if(STATE.chat.length>60)STATE.chat.splice(1,STATE.chat.length-60);
  if(STATE.tab!=='ai'){STATE.tab='ai'}render()}
function commitDraft(i){const x=STATE.drafts[i];if(!x||x.done)return;
  let made=null;if(x.t==='cc')made=addCardCharge({d:x.d,s:x.s,a:x.a,c:x.c,card:x.card,who:x.who||'Me',due:x.due||dueFor(x.card,x.d),...(x.tags?{tags:x.tags}:{})},x.pn||1,0);
  else{if(x.t==='repay'&&!x.ref){toast('Open the loan in Debts to log this repayment.');return}
    const t=own({id:uid(),t:x.t,a:x.a,d:x.d,w:x.w});['s','c','k','to','p','ref','tags'].forEach(k=>{if(x[k]!=null&&x[k]!=='')t[k]=x[k]});S.tx.push(t);if(x.every&&!S.demo)addRule(x.t,t,x.every)}
  if(made&&x.every&&!x.pn&&!S.demo)addRule('cc',made[0],x.every);
  x.done='Added '+peso(x.a)+(x.pn?` in ${x.pn} monthly installments`:'')+(x.every&&!S.demo?`, repeating ${x.every==='week'?'weekly':'monthly'}`:'')+'. ✓';save();render();if(x.every)runRecurring()}

/* ================= events ================= */
const ACT={
  tab:d=>{closeSheet();if(d.id===STATE.tab){window.scrollTo({top:0,behavior:REDUCED?'auto':'smooth'});return}
    STATE.scroll[STATE.tab]=window.scrollY;transition(()=>{STATE.tab=d.id;try{localStorage.setItem('pitaka.tab',d.id)}catch(e){}render();
    window.scrollTo(0,STATE.tab==='ai'?document.body.scrollHeight:(STATE.scroll[STATE.tab]||0))})},
  month:d=>transition(()=>{STATE.m=addM(STATE.m,+d.k);STATE.filter.limit=40;render()},+d.k>0?'next':'prev'),
  setm:d=>transition(()=>{const dir=d.id>STATE.m?'next':'prev';STATE.m=d.id;STATE.filter.limit=40;render();window.scrollTo(0,0)},d.id>STATE.m?'next':'prev'),
  insall:()=>{STATE.insAll=!STATE.insAll;render()},
  add:()=>addMenu(),close:()=>closeSheet(),settings:()=>{STATE.setPage='main';settings('main')},
  setpage:d=>{if(d.arg)STATE.setArg=d.arg;settings(d.id,d.dir||'fwd')},
  listmove:d=>{const L=S[d.l],i=L.findIndex(x=>x.id===d.id),j=i+(+d.k);if(i<0||j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];save();render();settings()},
  catmove:d=>{const i=S.cats.findIndex(c=>c.id===d.id),j=i+(+d.k);if(i<0||j<0||j>=S.cats.length)return;[S.cats[i],S.cats[j]]=[S.cats[j],S.cats[i]];save();render();settings()},
  mstart:d=>{S.cfg.mstart=+d.v;save();STATE.m=curP();render();settings()},
  cfgset:d=>{const k=d.k;let v=d.v;if(k==='dec'||k==='mstart'||k==='bkEvery')v=+v;S.cfg[k]=v;save();applyCfg();render();settings()},
  form:d=>openForm(d.t),
  edit:d=>{const t=S.tx.find(x=>x.id===d.id);if(t){if(t.t==='ccpay')delRecord('ccpay',t);else openForm(t.t,t)}},
  editcc:d=>{const c=S.cc.find(x=>x.id===d.id);if(c)openForm('cc',c)},
  repay:d=>{const l=S.tx.find(x=>x.id===d.id);if(l)openForm('repay',{ref:l.id,p:l.p,w:l.w})},
  paycc:d=>{const c=S.cc.find(x=>x.id===d.id);if(c)payCard(c,d.from==='plan')},
  unpay:d=>{const c=S.cc.find(x=>x.id===d.id);if(!c)return;askConfirm(c.direct?`Mark as unpaid? It was marked as paid by ${c.lo}.`:'Mark as unpaid? The payment record will be removed.',()=>{S.tx=S.tx.filter(t=>t.id!==c.pay);c.paid=false;delete c.pay;delete c.direct;delete c.paidOn;save();render();if(d.from==='plan')planSheet(c.plan)},'Mark unpaid')},
  plan:d=>planSheet(d.id),
  plandel:d=>delPlan(d.id),
  ccback:d=>{const c=S.cc.find(x=>x.id===d.id);if(c)openForm('repay',{ref:c.id,p:c.lo})},
  calc:(d,b)=>{const f=b.closest('.amtf'),k=$('.calcpad',f),inp=$('.amtin',f),open=k.hidden;k.hidden=!open;b.setAttribute('aria-expanded',open);b.classList.toggle('on',open);
    inp.setAttribute('inputmode',open?'none':'decimal');if(open)inp.blur();else inp.focus()},
  ckey:(d,b)=>{const inp=$('.amtin',b.closest('.amtf'));let v=inp.value.replace(/\s+/g,'');const k=d.k;
    if(k==='C')v='';else if(k==='del')v=v.slice(0,-1);
    else if(k==='='){const r=calc(v);if(isFinite(r))v=String(r)}
    else if('+−×÷'.includes(k)){if(!v)return;v=v.replace(/[+\-−×÷*/]$/,'')+k}
    else if(k==='%'){if(!/[\d)]$/.test(v))return;v+=k}
    else if(k==='.'){if(/[\d]*\.[\d]*$/.test(v.split(/[+\-−×÷*/]/).pop()))return;v+=(/\d$/.test(v)?'':'0')+k}
    else v+=k;
    inp.value=v;inp.dispatchEvent(new Event('input',{bubbles:true}))},
  cat:d=>{STATE.filter.cat=STATE.filter.cat===d.id?null:d.id;if(STATE.filter.cat)STATE.filter.type='all';render()},
  type:d=>{STATE.filter.type=d.id;if(d.id!=='all'&&d.id!=='exp'&&d.id!=='card')STATE.filter.cat=null;render()},
  more:()=>{STATE.filter.limit+=40;render()},
  tagf:d=>{STATE.filter.tag=STATE.filter.tag===d.id?null:d.id;render()},
  ask:d=>ask(d.q),
  dsave:d=>commitDraft(+d.id),
  dcat:d=>{const x=STATE.drafts[+d.id];if(x&&!x.done){x.c=d.c;x.picked=true;render()}},
  dshort:d=>{const x=STATE.drafts[+d.id];if(!x||!x.raw)return;S.cfg.shortcuts=[...S.cfg.shortcuts.filter(q=>q!==x.raw),x.raw].slice(-12);save();render();toast('Shortcut saved. It appears above the message box and in the + menu.')},
  dskip:d=>{const x=STATE.drafts[+d.id];if(x){x.done='Discarded.';render()}},
  recurview:()=>{STATE.setArg='';settings('recur')},
  dedit:d=>{const x=STATE.drafts[+d.id];if(!x||x.done)return;if(x.t==='repay'&&x.ref)openForm('repay',{ref:x.ref,p:x.p,w:x.w,a:x.a,d:x.d});else openForm(x.t==='repay'?'lend':x.t,{...x,id:undefined});x.done='Opened in the form.'},
  fresh:()=>askConfirm(S.demo?'Remove the sample data and start fresh?':'Erase all records and start fresh? You can undo this from Settings.',()=>{const had=!S.demo;snapshot('erase');const keep=S.demo?null:S.wallets;S=blank();if(keep)S.wallets=keep.map(w=>({...w,init:0}));STATE.chat=[];STATE.drafts=[];save();render();had?toast('Erased. Set your wallet balances in Settings.','undo','Undo'):toast('Starting fresh. Set your wallet balances in Settings.')},S.demo?'Start fresh':'Erase'),
  sample:()=>askConfirm(S.demo?'Reload the sample data?':'Replace your records with sample data? You can undo this from Settings.',()=>{const had=!S.demo;snapshot('sample');S=demo();STATE.chat=[];save();render();if(had)toast('Sample data loaded','undo','Undo')},'Load sample'),
  undo:()=>undoLast(),
  theme:()=>applyTheme(isDark()?'light':'dark'),
  themeset:d=>{applyTheme(d.id);refreshSettings()},
  undoask:()=>{const p=prevSnap();if(p)askConfirm(`Bring back your records from just before ${REASON[p.reason]||'the last change'} (${dLabel(p.at.slice(0,10))}, ${new Date(p.at).toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'})})? Changes made since then will be replaced.`,undoLast,'Bring back')},
  keepmine:()=>keepMine(),
  lockkey:d=>lockKey(d.k),
  lockbio:()=>bioUnlock(),
  lockcancel:()=>{hideLock();const d=LK.done;LK.done=null;if(d)d(false)},
  lockforgot:()=>{LK.forgot=LK.forgot||1;drawLock()},
  lockerase:()=>{if(LK.forgot<2){LK.forgot=2;drawLock();return}
    try{[KEY,PREV,LOCK_KEY,'pitaka.lastbk','pitaka.bksnooze'].forEach(k=>localStorage.removeItem(k));localStorage.setItem('pitaka.noauto','1')}catch(e){}location.reload()},
  lockon:d=>{const len=+d.v||4;showLock('set1',ok=>{if(ok){toast('App lock is on');refreshSettings()}},len)},
  lockoff:()=>showLock('check',ok=>{if(!ok)return;try{localStorage.removeItem(LOCK_KEY)}catch(e){}toast('App lock is off');refreshSettings()}),
  lockchange:()=>showLock('check',ok=>{if(!ok)return;const c=lockCfg();showLock('set1',ok2=>{if(ok2){toast('PIN changed');refreshSettings()}},c?c.len:4)}),
  lockset:d=>{const c=lockCfg();if(!c)return;if(d.k==='after')c.after=+d.v;if(d.k==='bio')c.bio=d.v==='1';try{localStorage.setItem(LOCK_KEY,JSON.stringify(c))}catch(e){}settings()},
  nudgeok:()=>{try{localStorage.setItem('pitaka.nudgeok',today())}catch(e){}render()},
  nudgeon:async d=>{const on=d.v==='1';if(on&&LN){try{const p=await LN.requestPermissions();if(p.display!=='granted'){toast('Allow notifications for Pitaka in your phone settings to get the reminder.');return}}catch(e){}}
    S.cfg.nudge.on=on;save();render();settings();if(on)toast(LN?`You’ll get a reminder at ${S.cfg.nudge.time} on days with nothing logged.`:'Pitaka will remind you when you open it after that time.')},
  bklater:()=>{try{localStorage.setItem('pitaka.bksnooze',addDays(today(),3))}catch(e){}render()},
  copybk:()=>{const txt=JSON.stringify(S);const done=()=>toast('Backup copied');
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt));else fallbackCopy(txt)},
  dlbk:()=>{if(saveFile(backupFile('json')))toast('Backup downloaded')},
  drive:()=>saveToDrive(),
  phonesave:()=>writePhone(true),
  update:()=>startUpdate(),updinstall:()=>installUpdate(),updcheck:()=>checkUpdate(true),
  updlater:()=>{UP.later=true;render()},
  installhide:()=>{try{localStorage.setItem('pitaka.installhint','hide')}catch(e){}render()},
  pastebk:()=>restore($('#pastebk').value)};
function fallbackCopy(txt){const ta=$('#pastebk');if(ta){ta.value=txt;ta.select();toast('Selected. Copy it from the box.')}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset,b)}});
let st_;document.addEventListener('input',e=>{if(e.target.classList.contains('amtin'))calcShow(e.target);if(e.target.id==='search'){clearTimeout(st_);st_=setTimeout(()=>{STATE.filter.q=e.target.value;STATE.filter.limit=40;const pos=e.target.selectionStart;render();const s=$('#search');s.focus();try{s.setSelectionRange(pos,pos)}catch(_){}},180)}});
$('#aiform').onsubmit=e=>{e.preventDefault();const i=$('#aiinput');const v=i.value;i.value='';ask(v)};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetOpen())closeSheet()});

if(lockCfg()){document.documentElement.classList.add('locked')}
load();applyCfg();STATE.m=curP();if(S.cfg.start!=='last')STATE.tab=S.cfg.start;applyTheme(themePref());render();
if(lockCfg())showLock('unlock');
if(BIO)BIO.available().then(r=>{LK.bioOK=!!(r&&r.available);if(LK.on&&LK.mode==='unlock')drawLock();const c=lockCfg();if(LK.bioOK&&LK.on&&c&&c.bio)bioUnlock()}).catch(()=>{});
if(NATIVE)bootPhone();else try{localStorage.removeItem('pitaka.noauto')}catch(e){}
runRecurring();scheduleNudges();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(curP()!==STATE.m&&STATE.lastSeen&&STATE.lastSeen!==today())STATE.m=curP();runRecurring();STATE.lastSeen=today()}});
STATE.lastSeen=today();
if(UPD)setTimeout(()=>checkUpdate(false),3000);
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if(!NATIVE&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
