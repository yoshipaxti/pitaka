<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style><title>Pitaka</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<script>try{var t=localStorage.getItem('pitaka.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pitaka">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* Inter is bundled with the app (fonts/, SIL Open Font License), so it works offline and nothing is fetched from other sites. */
@font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-latin-ext.woff2) format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
/* Layout: phone-first single column (max 560px), translucent bar on top, translucent tab bar at bottom, sheets slide up for every form.
   Look: iOS-inspired. Grouped gray background, white rounded cards without borders, hairline separators, capsule buttons, frosted bars. */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --surface-2:#efeff4; --line:rgba(60,60,67,.18); --fg:#000000; --muted:#6c6c70;
  --accent:#0066cc; --accent-fill:#0071e3; --accent-fg:#ffffff; --accent-soft:#e3eefc;
  --pos:#1a7f37; --pos-soft:#e2f4e6; --neg:#d70015; --neg-soft:#fde7e9;
  --warn:#b25000; --warn-soft:#fff0db; --owed:#5348c8; --owed-soft:#ebeafb;
  --c1:#34c759; --c2:#007aff; --c3:#ff3b30; --c4:#af52de; --c5:#ff9500; --c6:#30b0c7; --c7:#ffcc00; --c8:#ff2d55;
  --bar:rgba(242,242,247,.8); --shadow:0 8px 24px rgba(0,0,0,.16);
  --font-display:"Inter", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
  --font-body:var(--font-display);
  --font-data:var(--font-display);
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --line:rgba(84,84,88,.65); --fg:#ffffff; --muted:#98989f;
  --accent:#4da3ff; --accent-fill:#0071e3; --accent-fg:#ffffff; --accent-soft:#0e2a4a;
  --pos:#30d158; --pos-soft:#0e2e17; --neg:#ff6961; --neg-soft:#3b1513; --warn:#ff9f0a; --warn-soft:#3a2606; --owed:#9d9bff; --owed-soft:#1f1e45;
  --c1:#30d158; --c2:#0a84ff; --c3:#ff453a; --c4:#bf5af2; --c5:#ff9f0a; --c6:#40c8e0; --c7:#ffd60a; --c8:#ff375f;
  --bar:rgba(22,22,24,.78); --shadow:0 8px 24px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --line:rgba(84,84,88,.65); --fg:#ffffff; --muted:#98989f;
  --accent:#4da3ff; --accent-fill:#0071e3; --accent-fg:#ffffff; --accent-soft:#0e2a4a;
  --pos:#30d158; --pos-soft:#0e2e17; --neg:#ff6961; --neg-soft:#3b1513; --warn:#ff9f0a; --warn-soft:#3a2606; --owed:#9d9bff; --owed-soft:#1f1e45;
  --c1:#30d158; --c2:#0a84ff; --c3:#ff453a; --c4:#bf5af2; --c5:#ff9f0a; --c6:#40c8e0; --c7:#ffd60a; --c8:#ff375f;
  --bar:rgba(22,22,24,.78); --shadow:0 8px 24px rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-body);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono,.amt{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)} .owed{color:var(--owed)} .muted{color:var(--muted)}

/* frosted top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:6px;padding-block:8px}
@media (max-width:374px){.brand b{display:none}.month b{min-width:68px}}
.mstart .brand b{display:none}
.mstart .month b{min-width:96px;font-size:13px;white-space:nowrap}
.brand{display:flex;align-items:center;gap:8px;font:700 17px/1 var(--font-display);letter-spacing:-.02em}
.brand i{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:linear-gradient(180deg,#3d9bff,#0066cc);color:#fff;font-style:normal;font-size:16px;font-weight:700}
.month{margin-left:auto;display:flex;align-items:center;gap:0;background:var(--surface-2);border-radius:999px;padding:2px}
.month b{font:600 15px/1 var(--font-display);min-width:80px;text-align:center}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border:0;background:none;border-radius:999px;color:var(--accent)}
.icon-btn:active{opacity:.5;transform:scale(.9)}
.icon-btn svg,.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

main.wrap{padding-block:4px 160px;display:flex;flex-direction:column;gap:16px}
.ltitle{font:700 34px/1.15 var(--font-display);letter-spacing:-.03em;margin:10px 0 -4px}

/* grouped cards */
.card{background:var(--surface);border-radius:var(--r);padding:16px;min-width:0}
.card h2{font:600 17px/1.2 var(--font-display);letter-spacing:-.02em;margin:0 0 10px;display:flex;align-items:center;gap:8px;text-wrap:balance}
.card h2 .right{margin-left:auto;font:400 13px var(--font-body);color:var(--muted)}
.eyebrow{font-size:13px;font-weight:500;color:var(--muted);margin:0 0 4px}
.big{font:700 28px/1.1 var(--font-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.sub{font-size:13px;color:var(--muted)}
.sub.neg{color:var(--neg)} .sub.warn{color:var(--warn)} .sub.pos{color:var(--pos)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
.rows{display:flex;flex-direction:column;gap:7px;margin-top:12px;padding-top:12px;border-top:.5px solid var(--line);font-size:14px}
.rows div{display:flex;justify-content:space-between;gap:8px}
.rows div b{font:500 14px var(--font-data);font-variant-numeric:tabular-nums;white-space:nowrap}

.notice{border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.notice b{font:600 15px var(--font-display);letter-spacing:-.01em}
.notice.bad{background:var(--neg-soft)}
.notice.warn{background:var(--warn-soft)}
.notice.good{background:var(--pos-soft)}
.notice.info{background:var(--accent-soft)}
.notice .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.notice .btn:not(.pri){background:var(--surface)}
.notice a{color:var(--accent);font-weight:600}

.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.brk{display:flex;flex-direction:column;gap:14px}
.brk .lbl{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:6px}
.brk .lbl b{font:500 13.5px var(--font-data);font-variant-numeric:tabular-nums;white-space:nowrap}

/* capsule buttons: gray-filled by default, blue-filled for the main action */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--surface-2);color:var(--accent);border-radius:999px;padding:10px 16px;min-height:40px;font-size:15px;font-weight:600}
.btn.pri{background:var(--accent-fill);color:var(--accent-fg)}
.btn.sm{padding:6px 13px;font-size:13.5px;min-height:34px}
.btn.danger{color:var(--neg)}
.btn:active{transform:scale(.96);opacity:.85}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
.pill.neg{background:var(--neg-soft)} .pill.pos{background:var(--pos-soft)} .pill.warn{background:var(--warn-soft)} .pill.zero{background:var(--surface-2);color:var(--muted)} .pill.owed{background:var(--owed-soft)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}

/* table (trend only) */
.tscroll{overflow-x:auto;margin-inline:-16px;padding-inline:16px}
table{border-collapse:collapse;width:100%;font:13px var(--font-data);font-variant-numeric:tabular-nums}
th{font:500 12px var(--font-body);color:var(--muted);text-align:right;padding:6px 8px;white-space:nowrap;border-bottom:.5px solid var(--line)}
td{text-align:right;padding:9px 8px;white-space:nowrap;border-bottom:.5px solid var(--line)}
th:first-child,td:first-child{text-align:left;font-family:var(--font-body);font-weight:600}
tr:last-child td{border-bottom:0}
tr.on td{background:var(--accent-soft)}
tbody tr{cursor:pointer}

/* wallets */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.wcard .head{display:flex;align-items:center;gap:8px;font-weight:600}
.wcard .head .pill{margin-left:auto}

/* inset list rows: separators start after the icon, like iOS lists */
.list{display:flex;flex-direction:column}
.item{position:relative;display:flex;align-items:center;gap:12px;padding:11px 0;border:0;background:none;text-align:left;width:100%}
.item+.item::before{content:"";position:absolute;top:0;left:48px;right:0;border-top:.5px solid var(--line)}
.item .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font:600 15px var(--font-display);flex:none;background:color-mix(in srgb,var(--ic) 18%,var(--surface));color:color-mix(in srgb,var(--ic) 45%,var(--fg))}
.item .mid{flex:1;min-width:0}
.item .t{font-weight:500;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .r{text-align:right;flex:none}
.item .r b{font:500 15px var(--font-data);font-variant-numeric:tabular-nums;display:block}
.item .r small{font-size:12px;color:var(--muted)}
.empty{padding:18px 4px;text-align:center;color:var(--muted);font-size:14px}

/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--surface-2);border-radius:99px;padding:6px 13px;min-height:34px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.chip.on{background:var(--accent-fill);color:var(--accent-fg)}
.search{width:100%;border:0;background:var(--surface-2);border-radius:10px;padding:9px 12px;font-size:16px}
.search::placeholder{color:var(--muted)}

/* donut */
.donut{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:460px){.donut{grid-template-columns:1fr;justify-items:center;gap:12px}}
.donut svg{width:150px;height:150px;max-width:100%}
.donut circle{cursor:pointer}
.legend{display:flex;flex-direction:column;gap:0;width:100%;min-width:0}
.legend button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:7px 0;min-height:36px;text-align:left;font-size:15px;min-width:0;width:100%}
.legend button+button{border-top:.5px solid var(--line)}
.legend button span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend button b{font:500 14px var(--font-data);font-variant-numeric:tabular-nums;white-space:nowrap}
.legend button.dim{opacity:.4}

/* frosted tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:11px;font-weight:500;color:var(--muted)}
.tab.on{color:var(--accent)}
.fab{position:fixed;z-index:7;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(72px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent-fill);color:var(--accent-fg);font-size:30px;font-weight:300;line-height:1;box-shadow:var(--shadow)}
.fab:active{transform:scale(.94)}
@media (min-width:600px){.fab{right:calc(50% - 280px + 16px)}}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.sheet{position:relative;will-change:transform;width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:14px 14px 0 0;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.sheet-wrap .scrim{animation:fade .25s ease-out}
.sheet-wrap.closing .scrim{opacity:0;transition:opacity .22s ease-in}
.sheet-wrap.closing .sheet{transform:translateY(105%);transition:transform .23s cubic-bezier(.4,0,1,1)}
.sheet-wrap.closing{pointer-events:none}
#sheetBody.pg-fwd{animation:pg-fwd .28s cubic-bezier(.2,.9,.3,1)}
#sheetBody.pg-back{animation:pg-back .28s cubic-bezier(.2,.9,.3,1)}
@keyframes pg-fwd{from{opacity:0;transform:translateX(28px)}}
@keyframes pg-back{from{opacity:0;transform:translateX(-28px)}}
.grab{width:36px;height:5px;border-radius:9px;background:color-mix(in srgb,var(--muted) 45%,transparent);margin:2px auto 12px}
.sheet h3{font:700 22px var(--font-display);letter-spacing:-.02em;margin:0 0 14px}
.form{display:flex;flex-direction:column;gap:14px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--muted)}
.form input,.form select,.form textarea{border:0;background:var(--surface-2);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--fg);width:100%;min-width:0}
.form .amtin{font:600 30px var(--font-data);font-variant-numeric:tabular-nums;letter-spacing:-.02em;padding:8px 12px}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .row2>label{min-width:0}
.hint{font-size:13px;color:var(--accent);font-weight:500;min-height:17px}
.hint .alt{border:0;background:none;padding:0;color:inherit;font:inherit;text-decoration:underline;text-underline-offset:2px}
.flabel{font-size:13px;font-weight:500;color:var(--muted)}
.actions-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.act{border:0;background:var(--surface-2);border-radius:14px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:500}
.act i{font-style:normal;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:600 18px var(--font-display);color:#fff}

/* assistant: message bubbles */
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;padding:9px 13px;border-radius:19px;font-size:15px;line-height:1.45}
.msg.me{align-self:flex-end;background:var(--accent-fill);color:var(--accent-fg);border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--surface);border-bottom-left-radius:6px}
.msg.bot ul{margin:6px 0 0;padding-left:18px}
.msg.bot li{margin:3px 0}
.msg .draft{margin-top:10px;padding:12px;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.msg .draft .chip{background:var(--surface)}
.msg .draft .chip.on{background:var(--accent-fill)}
.msg .draft .btns{margin-top:2px}
.ai-head{display:flex;gap:12px;align-items:center}
.ai-head .orb{width:40px;height:40px;border-radius:50%;background:linear-gradient(180deg,#3d9bff,#0066cc);color:#fff;display:grid;place-items:center;font:600 19px var(--font-display);flex:none}
.composer{position:fixed;left:0;right:0;bottom:calc(54px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line)}
.composer .wrap{padding-block:8px;display:flex;flex-direction:column;gap:8px}
.composer form{display:flex;gap:8px}
.composer input{flex:1;min-width:0;border:.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font-size:16px}
.composer .chip{background:var(--surface)}
.composer .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.composer .chips::-webkit-scrollbar{display:none}

.tact{border:0;background:none;color:#5ab0ff;font:inherit;font-weight:700;padding:4px 2px 4px 10px;min-height:32px}
.toast{opacity:0;pointer-events:none;transition:opacity .2s ease,transform .3s cubic-bezier(.2,.9,.3,1);display:flex;align-items:center;gap:4px;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:30;background:rgba(28,28,30,.92);color:#fff;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.split{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cv{content-visibility:auto;contain-intrinsic-size:auto 400px}
.toast{transform:translate(-50%,14px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}

/* ---- motion: press feedback, view changes, growing bars, new chat bubbles ---- */
.btn,.chip,.act,.icon-btn,.tab svg,.setrow,.item,.legend button,.hero-k button,.fab{transition:transform .14s ease,background-color .2s ease,color .2s ease,opacity .2s ease;touch-action:manipulation}
.chip:active,.act:active,.hero-k button:active{transform:scale(.95)}
.fab:active{transform:scale(.9)}
.tab:active svg{transform:scale(.86)}
.item:active,.setrow:active{background:color-mix(in srgb,var(--fg) 6%,transparent)}
.item{border-radius:10px}
main#view{view-transition-name:view}
::view-transition-old(root),::view-transition-new(root){animation:none}
::view-transition-old(view){animation:vt-out .14s ease-in both}
::view-transition-new(view){animation:vt-in .26s cubic-bezier(.2,.9,.3,1) both}
:root[data-vt=next]::view-transition-new(view){animation-name:vt-in-r}
:root[data-vt=prev]::view-transition-new(view){animation-name:vt-in-l}
:root[data-vt=next]::view-transition-old(view){animation:vt-out-l .16s ease-in both}
:root[data-vt=prev]::view-transition-old(view){animation:vt-out-r .16s ease-in both}
#view.enter{animation:vt-in .26s cubic-bezier(.2,.9,.3,1)}
#view.enter-next{animation:vt-in-r .26s cubic-bezier(.2,.9,.3,1)}
#view.enter-prev{animation:vt-in-l .26s cubic-bezier(.2,.9,.3,1)}

<script>
"use strict";
/* ================= utils ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const parseISO=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,k)=>{const d=parseISO(s);d.setDate(d.getDate()+k);return iso(d)};
const addM=(m,k)=>{let[y,mo]=m.split('-').map(Number);mo+=k;while(mo>12){mo-=12;y++}while(mo<1){mo+=12;y--}return y+'-'+pad(mo)};
const nextM=m=>addM(m,1);
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const mLabel=m=>MN[+m.slice(5,7)-1]+' '+m.slice(0,4);
const dLabel=s=>s?(S&&S.cfg&&S.cfg.date==='dm'?(+s.slice(8,10))+' '+MN[+s.slice(5,7)-1]:MN[+s.slice(5,7)-1]+' '+(+s.slice(8,10))):'—';
const daysTo=s=>Math.round((parseISO(s)-parseISO(today()))/864e5);
const dayName=s=>{const k=daysTo(s);return k===0?'Today':k===-1?'Yesterday':['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][parseISO(s).getDay()]+', '+dLabel(s)};
function dueTag(due){const k=daysTo(due);
  const [c,t]=k<0?['neg',`Overdue ${-k} day${k<-1?'s':''} · was due ${dLabel(due)}`]:k===0?['neg','Due today']:k<=7?['warn',`Due ${dLabel(due)} · in ${k} day${k>1?'s':''}`]:['muted',`Due ${dLabel(due)}`];
  return`<div class="due ${c}">${t}</div>`}
const dim=m=>new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
/* Periods: "month" m (YYYY-MM) starts on Settings › Month starts on (S.cfg.mstart, e.g. payday the 15th) and runs to the day
   before the next one. With the default (the 1st) a period is the calendar month. */
const MS=()=>S&&S.cfg?S.cfg.mstart||1:1;
const pS=m=>m+'-'+pad(Math.min(MS(),dim(m)));
const pE=m=>pS(addM(m,1));
const inP=(d,m)=>d>=pS(m)&&d<pE(m);
const periodOf=d=>d>=pS(d.slice(0,7))?d.slice(0,7):addM(d.slice(0,7),-1);
const curP=()=>periodOf(today());
const pDays=m=>Math.round((parseISO(pE(m))-parseISO(pS(m)))/864e5);
const pLabel=m=>MS()===1?mLabel(m):dLabel(pS(m))+' – '+dLabel(addDays(pE(m),-1));
const pShort=m=>MS()===1?mLabel(m):dLabel(pS(m));
const num=v=>{const n=parseFloat(String(v??'').replace(/[^\d.\-]/g,''));return isFinite(n)?Math.round(n*100)/100:NaN};
/* Money and date formatting follow Settings › Currency & format (S.cfg). */
let NF=new Intl.NumberFormat('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const NF0=new Intl.NumberFormat('en-PH',{maximumFractionDigits:0});
const CUR=()=>S&&S.cfg?S.cfg.cur:'₱';
const DEC=()=>S&&S.cfg?S.cfg.dec:2;
const peso=n=>(n<-(DEC()?0.004:0.5)?'-':'')+CUR()+NF.format(Math.abs(n)||0);
const pesoS=n=>(n<-0.5?'-':'')+CUR()+NF0.format(Math.abs(n)||0);
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'0%';
/* Tags: free labels on any record (#family, #trip), stored lowercase without the #. */
const parseTags=str=>[...new Set(String(str||'').split(/[\s,]+/).map(x=>x.replace(/^#+/,'').toLowerCase().replace(/[^\p{L}\p{N}_-]/gu,'')).filter(Boolean))].slice(0,8);
const tagStr=t=>(t&&t.length?t.map(x=>'#'+x).join(' '):'');
const ord=n=>n+(n%100>=11&&n%100<=13?'th':['th','st','nd','rd'][n%10]||'th');
const sum=(arr,f=x=>x.a)=>arr.reduce((s,x)=>s+f(x),0);
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
/* Same day of the month, k months later (the 31st becomes the last day of a shorter month). */
const addMonths=(d,k)=>{const m=addM(d.slice(0,7),k);return m+'-'+pad(Math.min(+d.slice(8,10),dim(m)))};
/* Calculator: an amount can be a sum like 120+45×2 or 1500-10%. calc() reads it with a small parser that only does
   arithmetic (it never runs code). "a+b%" and "a-b%" add or take off b percent of a, like a pocket calculator. */
const CALC_OPS=/[+×÷*/%]|\d\s*[-−]/;
function calc(v){const s=String(v??'').replace(/[×xX]/g,'*').replace(/÷/g,'/').replace(/[−–]/g,'-').replace(/[^\d.+\-*/()%]/g,'');let i=0;
  const number=()=>{const j=i;while(i<s.length&&/[\d.]/.test(s[i]))i++;const n=i>j?Number(s.slice(j,i)):NaN;if(!isFinite(n))throw 0;let x=n;while(s[i]==='%'){i++;x/=100}return x};
  const factor=()=>{if(s[i]==='-'){i++;return-factor()}if(s[i]==='+'){i++;return factor()}
    if(s[i]==='('){i++;const x=expr();if(s[i]===')')i++;return x}return number()};
  const term=()=>{let x=factor();while(s[i]==='*'||s[i]==='/'){const o=s[i++],y=factor();x=o==='*'?x*y:x/y}return x};
  const expr=()=>{let x=term();while(s[i]==='+'||s[i]==='-'){const o=s[i++],j=i;let y=term();if(/^[\d.]+%$/.test(s.slice(j,i)))y*=x;x=o==='+'?x+y:x-y}return x};
  try{if(!s)return NaN;const x=expr();return i<s.length||!isFinite(x)?NaN:Math.round(x*100)/100}catch(e){return NaN}}

/* ================= data ================= */
const KEY='pitaka.v1';
/* Categories are the person's own list (Settings › Categories & budgets): name, emoji, color (1–8 of the theme palette)
   and an optional monthly budget. These are the starting set; the built-in word list knows their ids. */
const CATS0=[
  {id:'food',name:'Food',col:7,ic:'🍚'},{id:'transpo',name:'Transportation',col:2,ic:'🚌'},{id:'bills',name:'Bills & Utilities',col:4,ic:'💡'},
  {id:'load',name:'Load & Internet',col:6,ic:'📶'},{id:'shop',name:'Personal & Shopping',col:8,ic:'🛍️'},{id:'health',name:'Health',col:1,ic:'💊'},
  {id:'edu',name:'Education',col:5,ic:'📚'},{id:'other',name:'Other Expenses',col:3,ic:'📦'}];
const catOf=id=>S.cats.find(c=>c.id===id)||S.cats.find(c=>c.id==='other')||S.cats[S.cats.length-1];
const fallbackCat=()=>(S.cats.find(c=>c.id==='other')||S.cats[S.cats.length-1]).id;
const catName=id=>catOf(id).name;
const catCol=id=>`var(--c${catOf(id).col})`;
const catIc=id=>{const c=catOf(id);return c.ic||c.name.charAt(0)};

/* Everything the person can customize lives in S.cfg (and the lists next to it), so it travels with backups.
   migrate() fills in anything missing, for records saved by older versions of the app. */
const CFG0={cur:'₱',dec:2,date:'md',text:'md',start:'last',mstart:1,bkEvery:7,nudge:{on:false,time:'20:00'},shortcuts:[],lockAfter:0};
function migrate(d){d.cfg={...CFG0,...(d.cfg||{})};d.cfg.nudge={...CFG0.nudge,...(d.cfg.nudge||{})};
  if(!Array.isArray(d.cats)||!d.cats.length)d.cats=CATS0.map(c=>({...c}));
  d.cc=d.cc||[];d.cards=d.cards&&d.cards.length?d.cards:['Credit Card'];d.cardCfg=d.cardCfg||{};
  if(!Array.isArray(d.goals))d.goals=d.goal&&d.goal.amt>0?[{id:'g'+uid(),name:'Savings goal',amt:d.goal.amt,w:d.goal.w,due:''}]:[];delete d.goal;
  if(!Array.isArray(d.recur))d.recur=[];
  if(!Array.isArray(d.incTypes)||!d.incTypes.length)d.incTypes=['Salary','Freelance','Bonus','Allowance','Gift','Refund','Other'];
  return d}
function blank(){return migrate({v:1,demo:false,
  wallets:[{id:'cash',name:'Cash',col:1,init:0},{id:'gcash',name:'GCash',col:2,init:0},{id:'cimb',name:'CIMB (GSave)',col:3,init:0},
    {id:'uno',name:'UNO Digital',col:4,init:0},{id:'mari',name:'Maribank',col:5,init:0},{id:'gotyme',name:'GoTyme',col:6,init:0}],
  cards:['Credit Card','SPayLater'],cardCfg:{'Credit Card':{close:25,due:15}},tx:[],cc:[],goals:[{id:'g1',name:'Emergency fund',amt:20000,w:'gotyme',due:''}]})}

function demo(){
  const s=blank();s.demo=true;s.wallets[0].init=2000;s.wallets[1].init=3500;s.wallets[5].init=12000;
  const m=today().slice(0,7),pm=addM(m,-1),td=+today().slice(8);
  const D=(mm,d)=>mm+'-'+pad(mm===m?Math.min(d,td):Math.min(d,dim(mm)));
  const E=(mm,d,x,a,c,w)=>s.tx.push({id:uid(),t:'exp',d:D(mm,d),a,s:x,c,w});
  const I=(mm,d,x,a,w,k='Salary')=>s.tx.push({id:uid(),t:'inc',d:D(mm,d),a,s:x,k,w});
  [[2,'Jeep + trike to work',82,'transpo','cash'],[3,'Carinderia lunch',95,'food','cash'],[5,'Globe load 30 days',299,'load','gcash'],

    catch(e){DAMAGED=KEY+'.damaged-'+Date.now();try{localStorage.setItem(DAMAGED,r)}catch(_){DAMAGED='unsaved'}}}
  S=demo();FRESH=true}

const W=id=>S.wallets.find(w=>w.id===id)||{id,name:id||'—',col:3};

const wIc=w=>w.ic?esc(w.ic)+' ':'';
/* Card due dates: a card's statement closes on its close day; payment is due on its due day after that. */
function dueFor(card,d){const c=S.cardCfg[card];if(!c||!c.due||!d)return'';
  let m=d.slice(0,7),stmt;if(c.close){stmt=m+'-'+pad(Math.min(c.close,dim(m)));if(d>stmt){m=addM(m,1);stmt=m+'-'+pad(Math.min(c.close,dim(m)))}}else stmt=d;
  let dm=stmt.slice(0,7),due=dm+'-'+pad(Math.min(c.due,dim(dm)));if(due<=stmt){dm=addM(dm,1);due=dm+'-'+pad(Math.min(c.due,dim(dm)))}return due}
/* Undo: before anything removes records, the current records are kept as one snapshot (and, on Android, a file in
   Documents/Pitaka/backups). Undo brings them back; it is offered in a toast right away and in Settings afterwards. */
const PREV='pitaka.v1.prev';
const REASON={delete:'a delete',erase:'Erase everything',sample:'Load sample data',restore:'a restore',undo:'the undo'};
function snapshot(reason){if(S.demo)return;const snap={reason,at:new Date().toISOString(),data:JSON.parse(JSON.stringify(S))};
  try{localStorage.setItem(PREV,JSON.stringify(snap))}catch(e){}
  if(FS)FS.writeFile({path:`${PHONE.dir}/pitaka-before-${reason}-${today()}.json`,data:JSON.stringify(snap.data,null,1),directory:'DOCUMENTS',encoding:'utf8',recursive:true}).catch(()=>{})}
function prevSnap(){try{const p=JSON.parse(localStorage.getItem(PREV)||'null');return p&&p.data&&Array.isArray(p.data.tx)?p:null}catch(e){return null}}

/* ================= money math ================= */
function apply(b,t){const a=t.a;switch(t.t){
  case 'inc':case 'repay':b[t.w]=(b[t.w]||0)+a;break;
  case 'exp':case 'lend':case 'ccpay':b[t.w]=(b[t.w]||0)-a;break;
  case 'xfer':b[t.w]=(b[t.w]||0)-a;b[t.to]=(b[t.to]||0)+a;break}}
function balances(before){const b={};S.wallets.forEach(w=>b[w.id]=+w.init||0);for(const t of S.tx){if(before&&t.d>=before)continue;apply(b,t)}return b}
const sumBal=b=>Object.values(b).reduce((s,x)=>s+x,0);
function monthStats(m){
  const r={inc:0,rep:0,exp:0,lent:0,ccp:0,cats:{},n:0};
  for(const t of S.tx){if(!inP(t.d,m))continue;
    if(t.t==='inc')r.inc+=t.a;else if(t.t==='repay')r.rep+=t.a;else if(t.t==='lend')r.lent+=t.a;else if(t.t==='ccpay')r.ccp+=t.a;
    else if(t.t==='exp'){r.exp+=t.a;r.cats[t.c]=(r.cats[t.c]||0)+t.a;r.n++}}
  /* Card and SPayLater charges are spending too: each counts in its category in the month it is charged (an installment in
     its own month). Charges someone else made on my card are theirs, so they are left out. Cash flow (in, out, net) stays cash only. */
  r.card=0;r.nc=0;for(const c of S.cc){if(c.lo||!inP(c.d,m))continue;const k=catOf(c.c).id;r.card+=c.a;r.cats[k]=(r.cats[k]||0)+c.a;r.nc++}
  r.spend=r.exp+r.card;
  r.in=r.inc+r.rep;r.out=r.exp+r.lent+r.ccp;r.net=r.in-r.out;r.ccCharged=sum(S.cc.filter(c=>inP(c.d,m)));return r}
function loans(before){
  return S.tx.filter(t=>t.t==='lend'&&(!before||t.d<before)).map(l=>{
    const rp=S.tx.filter(t=>t.t==='repay'&&t.ref===l.id&&(!before||t.d<before));const paid=sum(rp);
    return{...l,paid,owed:Math.max(0,l.a-paid)}}).sort((a,b)=>(b.owed>0)-(a.owed>0)||b.d.localeCompare(a.d))}
/* Someone who borrowed my card (c.lo) owes me that charge until they pay me back (repayments point at the charge),
   or until they pay the bank themselves (c.direct). */
const ccIn=(c,before)=>!before||(c.pd||c.d)<before;
function cardOwed(c,before){if(!c.lo)return 0;if(c.direct&&(!before||(c.paidOn||c.d)<before))return 0;
  return Math.max(0,c.a-sum(S.tx.filter(t=>t.t==='repay'&&t.ref===c.id&&(!before||t.d<before))))}
const cardLoans=before=>S.cc.filter(c=>c.lo&&ccIn(c,before)).map(c=>({c,owed:cardOwed(c,before)}));
const owedTotal=before=>sum(loans(before),l=>l.owed)+sum(cardLoans(before),l=>l.owed);
/* Recurring entries: a rule keeps a template record and the next date. On open (and when the app comes back to the
   front) every rule whose date has come adds its record, then moves to the next week or month. */
const EVERY={week:'Every week',month:'Every month'};
const nextDate=(r,d)=>{if(r.every==='week')return addDays(d,7);const m=addM(d.slice(0,7),1);return m+'-'+pad(Math.min(r.day||+d.slice(8),dim(m)))};
function runRecurring(){if(!S||S.demo)return 0;const t=today();let n=0;
  for(const r of S.recur){if(!r.on)continue;let guard=0;
    while(r.next&&r.next<=t&&guard++<60){const x={...r.tpl,id:uid(),d:r.next,rec:r.id};
      if(r.kind==='cc'){x.paid=false;x.due=dueFor(x.card,x.d);S.cc.push(x)}else{x.t=r.kind;S.tx.push(x)}n++;r.next=nextDate(r,r.next)}}
  if(n){save();render();toast(`Added ${n} repeating entr${n>1?'ies':'y'}`,'recurview','See')}return n}
function addRule(kind,rec,every){const tpl={...rec};['id','d','t','rec','mine','paid','pay','due','plan','pk','pn','pa','pr','pd','direct','paidOn'].forEach(k=>delete tpl[k]);
  const r={id:'r'+uid(),kind,every,day:+rec.d.slice(8),tpl,on:true};r.next=nextDate(r,rec.d);rec.rec=r.id;S.recur.push(r);return r}
const ruleName=r=>r.tpl.s||(r.kind==='inc'?r.tpl.k:r.kind==='xfer'?W(r.tpl.w).name+' → '+W(r.tpl.to).name:'Repeating entry');
/* Monthly budgets: one limit per category, compared with that month's day-to-day spending in it. */
function budgets(m){const st=monthStats(m);return S.cats.filter(c=>c.budget>0).map(c=>{const spent=st.cats[c.id]||0;return{c,spent,limit:c.budget,p:spent/c.budget}})}

function ccPaidDate(c){if(!c.paid)return null;const t=S.tx.find(x=>x.id===c.pay);return t?t.d:c.paidOn||c.d}
/* Unpaid card items as of a date. An installment is owed from the day of the purchase (c.pd), not only from its own month.
   By default only my own charges count (my card debt); all=true adds charges made by people who borrowed my card. */
function ccOpen(before,all){return S.cc.filter(c=>(all||!c.lo)&&ccIn(c,before)&&(!c.paid||(before&&ccPaidDate(c)>=before)))}
const ccUnpaid=(before,all)=>sum(ccOpen(before,all));
/* Installments (SPayLater, card installment plans): one purchase split into n monthly charges. Each month is its own card
   item, so paying, due dates and totals work as for any charge; they share c.plan and know their place (pk of pn), the
   price (pa), the add-on interest per month (pr, % of the price) and the purchase date (pd). */
function planAmounts(price,n,rate){const total=Math.round(price*(1+(rate||0)/100*n)*100)/100,each=Math.round(total/n*100)/100;
  return{total,each,last:Math.round((total-each*(n-1))*100)/100}}
function addCardCharge(base,n,rate){n=Math.max(1,Math.min(60,Math.round(n)||1));
  if(n===1){const c=own({...base,id:uid(),paid:false});S.cc.push(c);return[c]}
  const{each,last}=planAmounts(base.a,n,rate),plan='p'+uid(),out=[];
  for(let k=0;k<n;k++){const d=addMonths(base.d,k);
    out.push(own({...base,id:uid(),plan,pk:k+1,pn:n,pa:base.a,pr:rate||0,pd:base.d,d,a:k===n-1?last:each,due:base.due?addMonths(base.due,k):dueFor(base.card,d),paid:false}))}
  S.cc.push(...out);return out}
const planItems=id=>S.cc.filter(c=>c.plan===id).sort((a,b)=>a.pk-b.pk);
/* Card charges saved by older versions have no category: guess one from the description, the same way expenses are guessed. */
function fillCcCats(){for(const c of S.cc)if(!c.c||!S.cats.some(k=>k.id===c.c)){const p=predict(c.s||'');c.c=p&&p.p>.3?p.c:fallbackCat()}}

const STOP=new Set('the a an and or for to at in on of my ko sa ng na po with from via using paid pay bayad php peso pesos at ang mga si ni kay para papunta pauwi going home new bagong'.split(' '));

const words=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/(\w)'s\b/g,'$1').replace(/[.'’]/g,'')
  .replace(/\bs&r\b/g,'snr').replace(/\bj&t\b/g,'jnt').replace(/\bh&m\b/g,'hm').replace(/(\w)-(?=\w)/g,'$1') // x-ray, halo-halo, pag-ibig, 7-eleven
  .replace(/[^a-z0-9+]+/g,' ').split(' ').filter(w=>w.length>1&&!/^\d+(kg|g|ml|l|pcs|x)?$/.test(w))

const WEAK=new Set('work office trabaho opisina school eskwela bahay house mall friends family barkada mama papa kuya ate bunso anak lola lolo tita tito'.split(' '));
const tok=s=>{const ws=words(s).filter(w=>!STOP.has(w));const out=[...ws];for(let i=0;i<ws.length-1;i++)out.push(ws[i]+'_'+ws[i+1]);return out};
const seedTok=p=>p.split('_').map(stem).join('_');
/* Typo tolerance: "jolibee" ≈ "jollibee", "grocerries" ≈ "grocery". Damerau distance, stopping early once too far. */
function editDist(a,b,max){if(Math.abs(a.length-b.length)>max)return max+1;let p2=null,p=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){const c=[i];let lo=i;for(let j=1;j<=b.length;j++){const x=a[i-1]===b[j-1]?0:1;
    let v=Math.min(p[j]+1,c[j-1]+1,p[j-1]+x);if(p2&&i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])v=Math.min(v,p2[j-2]+1);c[j]=v;if(v<lo)lo=v}

  const add=(c,ws,w)=>{const cc=M.cnt[c]=M.cnt[c]||{};for(const t of ws){cc[t]=(cc[t]||0)+w;M.tot[c]=(M.tot[c]||0)+w;M.V.add(t)}};
  for(const c in SEED)if(S.cats.some(k=>k.id===c))add(c,SEED[c].split(/\s+/).filter(Boolean).map(seedTok),1);

  // Your own entries count 4x a seed word, so the app learns your habits (and your corrections) quickly.

  ${S.wallets.some(w=>w.hidden)?`<button class="linkbtn" data-act="setpage" data-id="wallets" style="align-self:flex-start">${S.wallets.filter(w=>w.hidden).length} hidden wallet${S.wallets.filter(w=>w.hidden).length>1?'s':''} · ${peso(sum(S.wallets.filter(w=>w.hidden),w=>close[w.id]||0))} · Manage</button>`:''}
  <section class="card"><h2>Transfers between wallets<span class="right">${xfers.length} this month</span></h2><div class="list">
    ${xfers.length?xfers.sort((a,b)=>b.d.localeCompare(a.d)).map(t=>txRow(t)).join(''):'<div class="empty">No transfers this month. Transfers move money between wallets without changing your totals.</div>'}</div></section>`},

spend(){const m=STATE.m,st=monthStats(m),F=STATE.filter;const cats=S.cats.filter(c=>st.cats[c.id]).sort((a,b)=>st.cats[b.id]-st.cats[a.id]);
  let acc=0;const arcs=cats.map(c=>{const p=st.cats[c.id]/(st.spend||1)*100;const s=`<circle r="15.915" cx="21" cy="21" fill="none" stroke="${catCol(c.id)}" stroke-width="6" stroke-dasharray="${Math.max(0,p-.4)} ${100-Math.max(0,p-.4)}" stroke-dashoffset="${25-acc}" data-act="cat" data-id="${c.id}" opacity="${F.cat&&F.cat!==c.id?.3:1}"><title>${esc(c.name)}</title></circle>`;acc+=p;return s}).join('');
  // My own card charges are listed with the rest (as type 'card'), so a category shows everything spent on it.
  let list=S.tx.filter(t=>inP(t.d,m)).concat(S.cc.filter(c=>!c.lo&&inP(c.d,m)).map(c=>({...c,t:'card',c:catOf(c.c).id})));
  if(F.type!=='all')list=list.filter(t=>F.type==='loan'?(t.t==='lend'||t.t==='repay'):t.t===F.type);
  if(F.cat)list=list.filter(t=>(t.t==='exp'||t.t==='card')&&t.c===F.cat);
  const tagsHere=[...new Set(list.flatMap(t=>t.tags||[]))].sort();
  if(F.tag)list=list.filter(t=>(t.tags||[]).includes(F.tag));
  if(F.q){const q=F.q.toLowerCase();list=list.filter(t=>((t.s||'')+' '+(t.n||'')+' '+(t.p||'')+' '+(t.t==='card'?t.card:W(t.w).name)+' '+tagStr(t.tags)).toLowerCase().includes(q))}
  list.sort((a,b)=>b.d.localeCompare(a.d));const shown=list.slice(0,F.limit);
  const bs=budgets(m);
  return`<h1 class="ltitle">Spending</h1>${bs.length?`<section class="card"><h2>Budgets<span class="right"><button class="linkbtn" data-act="setpage" data-id="cats">Edit</button></span></h2><div class="brk">
    ${bs.map(b=>`<button class="budrow" data-act="cat" data-id="${b.c.id}"><div class="lbl"><span>${esc(b.c.ic?b.c.ic+' ':'')}${esc(b.c.name)}</span><b class="${b.p>=1?'neg':''}">${peso(b.spent)} <span class="muted">of ${peso(b.limit)}</span></b></div>
      <div class="bar"><i style="width:${Math.min(100,b.p*100)}%;background:var(--${budgetLv(b.p)})"></i></div>
      <div class="sub ${b.p>=1?'neg':b.p>=.8?'warn':''}" style="margin-top:4px">${b.p>=1?`${peso(b.spent-b.limit)} over`:`${peso(b.limit-b.spent)} left`} · ${Math.round(b.p*100)}%</div></button>`).join('')}</div></section>`:''}
  <section class="card"><h2>Spending by category<span class="right">${st.n+st.nc} entr${st.n+st.nc===1?'y':'ies'}</span></h2>
    ${st.spend?`<div class="donut"><svg viewBox="0 0 42 42" role="img" aria-label="Category donut chart"><circle r="15.915" cx="21" cy="21" fill="none" stroke="var(--surface-2)" stroke-width="6"/>${arcs}
      <text x="21" y="20" text-anchor="middle" font-size="3" fill="var(--muted)" font-family="var(--font-body)">Total</text><text x="21" y="24.5" text-anchor="middle" font-size="4.2" font-weight="700" fill="var(--fg)" font-family="var(--font-display)">${pesoS(st.spend)}</text></svg>
      <div class="legend">${cats.map(c=>`<button data-act="cat" data-id="${c.id}" class="${F.cat&&F.cat!==c.id?'dim':''}"><i class="dot" style="background:${catCol(c.id)}"></i><span>${esc(c.ic?c.ic+' ':'')}${esc(c.name)}</span><b>${pesoS(st.cats[c.id])} · ${pct(st.cats[c.id],st.spend)}</b></button>`).join('')}</div></div>
      ${st.card?`<div class="paysplit"><span><i class="dot" style="background:var(--accent)"></i>Cash & e-wallets <b>${peso(st.exp)}</b></span><span><i class="dot" style="background:var(--warn)"></i>Cards & SPayLater <b>${peso(st.card)}</b></span></div>`:''}`
      :'<div class="empty">No expenses this month yet. Tap + to add one, or tell the assistant “lunch 120 gcash”.</div>'}</section>
  <section class="card"><h2>Transactions${F.cat?`<span class="pill zero">${esc(catName(F.cat))}</span>`:''}<span class="right">${list.length} shown</span></h2>
    <div style="display:flex;flex-direction:column;gap:10px"><input class="search" id="search" type="search" placeholder="Search description, person, wallet" value="${esc(F.q)}" aria-label="Search transactions">
    <div class="chips">${[['all','All'],['exp','Expenses'],['card','Card charges'],['inc','Income'],['xfer','Transfers'],['loan','Loans'],['ccpay','Card payments']].map(([k,l])=>`<button class="chip${F.type===k?' on':''}" data-act="type" data-id="${k}">${l}</button>`).join('')}${F.cat?`<button class="chip" data-act="cat" data-id="${F.cat}">Clear category ✕</button>`:''}</div>
    ${tagsHere.length?`<div class="chips tagchips" role="group" aria-label="Tags">${tagsHere.map(g=>`<button class="chip tag${F.tag===g?' on':''}" data-act="tagf" data-id="${esc(g)}" aria-pressed="${F.tag===g}">#${esc(g)}</button>`).join('')}</div>`:''}</div>
    <div class="list" style="margin-top:6px">${shown.length?dayGroups(shown,list):'<div class="empty">Nothing matches.</div>'}</div>
    ${list.length>shown.length?`<button class="btn" style="width:100%;margin-top:8px" data-act="more">Show ${Math.min(40,list.length-shown.length)} more</button>`:''}</section>`},

debts(){const L=loans(),CL=cardLoans(),open=ccOpen(),others=ccOpen(null,true).filter(c=>c.lo);
  const owed=sum(L,l=>l.owed)+sum(CL,l=>l.owed),people=new Set([...L.filter(l=>l.owed>0).map(l=>l.p),...CL.filter(l=>l.owed>0).map(l=>l.c.lo)]).size;
  const byCard={};open.forEach(c=>byCard[c.card]=(byCard[c.card]||0)+c.a);
  // One row per charge. An installment plan is one row that shows its next unpaid month; tap it to see every month.
  const rows=[],plans={};
  for(const c of S.cc){if(!c.plan){rows.push({items:[c]});continue}if(!plans[c.plan])rows.push(plans[c.plan]={items:[]});plans[c.plan].items.push(c)}
  rows.forEach(r=>{r.items.sort((a,b)=>(a.pk||0)-(b.pk||0));r.open=r.items.filter(c=>!c.paid);r.next=r.open[0];r.owed=sum(r.items,c=>cardOwed(c));r.done=!r.open.length&&!r.owed});
  rows.sort((a,b)=>(a.done-b.done)||((a.next&&a.next.due)||'9').localeCompare((b.next&&b.next.due)||'9'));
  return`<h1 class="ltitle">Debts</h1><div class="grid2">
    <section class="card"><p class="eyebrow">Owed to me</p><div class="big owed">${peso(owed)}</div><div class="sub">${people} ${people===1?'person':'people'} · lent this month ${peso(monthStats(STATE.m).lent)}${CL.some(l=>l.owed>0)?` · ${pesoS(sum(CL,l=>l.owed))} of it on my cards`:''}</div></section>
    <section class="card"><p class="eyebrow">What I owe</p><div class="big neg">${peso(sum(open))}</div><div class="sub">${Object.keys(byCard).map(k=>esc(k)+' '+pesoS(byCard[k])).join(' · ')||'All paid'}${others.length?`<br>Not counted: ${pesoS(sum(others))} others charged to my cards`:''}</div></section></div>
  <section class="card"><div class="split" style="margin-bottom:6px"><h2 style="margin:0">Money I lent</h2><button class="btn sm pri" data-act="form" data-t="lend">Lend cash</button></div>
    <div class="list">${L.length?L.map(l=>`<div class="item"><div class="ic" style="--ic:var(--owed)" aria-hidden="true">${esc((l.p||'?').charAt(0).toUpperCase())}</div>
      <button class="mid" style="border:0;background:none;padding:0;text-align:left" data-act="edit" data-id="${l.id}"><div class="t">${esc(l.p)}${l.s?` <span class="muted" style="font-weight:400">· ${esc(l.s)}</span>`:''}</div>
      <div class="m">${dLabel(l.d)} · ${esc(W(l.w).name)} · lent ${peso(l.a)}${l.paid?` · repaid ${peso(l.paid)}`:''}</div>${l.due&&l.owed>0?dueTag(l.due):''}</button>
      <div class="r">${l.owed>0?`<b class="neg">${peso(l.owed)}</b><button class="btn sm" data-act="repay" data-id="${l.id}" style="margin-top:4px">Repaid</button>`:`<span class="pill pos">Settled</span>`}</div></div>`).join(''):'<div class="empty">No loans yet. When family or friends borrow, log it here so you remember.</div>'}</div></section>
  <section class="card"><div class="split" style="margin-bottom:6px"><h2 style="margin:0">Card & SPayLater items</h2><button class="btn sm pri" data-act="form" data-t="cc">Add charge</button></div>
    <div class="list">${rows.length?rows.map(ccRow).join(''):'<div class="empty">No card charges logged.</div>'}</div></section>`},

ai(){if(!STATE.chat.length)STATE.chat.push({me:false,h:`<b>Hi! I am your on-device assistant.</b> `+summaryLine()+`<br><br>`+help()});
  return`<h1 class="ltitle">Assistant</h1><section class="ai-head"><div class="orb" aria-hidden="true">✦</div><div><div class="sub">Runs offline on your phone. No internet, no GPU, no data leaves the device.</div></div></section>
  <div class="chat" id="chat">${STATE.chat.map((c,i)=>`<div class="msg ${c.me?'me':'bot'}${c.fresh?' new':''}">${c.me?esc(c.h):c.h}${c.draft!=null?draftCard(c.draft):''}</div>`).join('')}</div><div style="height:96px"></div>`}};

/* A row in Debts › Card & SPayLater items: one charge, or one installment plan (r.items are its months). */
function ccRow(r){const f=r.items[0],plan=!!f.plan,c=r.next||r.items[r.items.length-1],back=r.items.find(x=>cardOwed(x)>0);
  const ic=f.lo?`<div class="ic" style="--ic:var(--owed)" aria-hidden="true">${esc(f.lo.charAt(0).toUpperCase())}</div>`:`<div class="ic" style="--ic:${catCol(f.c)}" aria-hidden="true">${esc(catIc(f.c))}</div>`;
  const meta=plan?`${esc(f.card)} · ${f.pn-r.open.length} of ${f.pn} paid`:`${esc(f.card)} · ${dLabel(f.d)} · ${esc(catName(f.c))}${f.who&&f.who!=='Me'&&!f.lo?' · for '+esc(f.who):''}`;
  const lo=f.lo?`<div class="m owedtxt">${r.owed>0?`${esc(f.lo)} owes you ${pesoS(r.owed)}`:`Used by ${esc(f.lo)} · settled`}</div>`:'';
  const bank=r.next?`<button class="btn sm" data-act="paycc" data-id="${r.next.id}">${plan?`Pay ${pesoS(r.next.a)}`:'Mark paid'}</button>`
    :plan?`<span class="pill pos">Paid off</span>`:`<button class="btn sm" data-act="unpay" data-id="${f.id}">Paid ✓</button>`;
  return`<div class="item">${ic}<button class="mid" style="border:0;background:none;padding:0;text-align:left" data-act="${plan?'plan':'editcc'}" data-id="${plan?f.plan:f.id}">
    <div class="t">${esc(f.s)}</div><div class="m">${meta}${f.tags?' · <span class="tagtxt">'+esc(tagStr(f.tags))+'</span>':''}</div>${lo}${r.next&&r.next.due?dueTag(r.next.due):''}</button>
    <div class="r stack"><b>${peso(plan?sum(r.open):f.a)}</b>${plan&&r.open.length?'<small>left</small>':''}${back?`<button class="btn sm" data-act="ccback" data-id="${back.id}">Paid back</button>`:''}${bank}</div></div>`}
function planSheet(id){const it=planItems(id);if(!it.length){closeSheet();return}const f=it[0],{total}=planAmounts(f.pa,f.pn,f.pr),open=it.filter(c=>!c.paid),owed=sum(it,c=>cardOwed(c));
  sheet(`<h3>${esc(f.s)}</h3><div class="sub">${esc(f.card)} · ${esc(catName(f.c))} · bought ${dLabel(f.pd||f.d)}, ${(f.pd||f.d).slice(0,4)}${f.lo?` · <span class="owedtxt">used by ${esc(f.lo)}</span>`:''}</div>
  <div class="plansum"><div><span>Price</span><b>${peso(f.pa)}</b></div><div><span>${f.pr?`Interest (${f.pr}% a month)`:'Interest'}</span><b>${peso(total-f.pa)}</b></div>
    <div><span>Paid (${f.pn-open.length} of ${f.pn})</span><b class="pos">${peso(sum(it.filter(c=>c.paid)))}</b></div><div><span>Left to pay</span><b class="warn">${peso(sum(open))}</b></div></div>
  ${f.lo&&owed>0?`<p class="sub owedtxt" style="margin:0 0 8px">${esc(f.lo)} still owes you ${peso(owed)} for this.</p>`:''}
  <div class="list">${it.map(c=>`<div class="item"><div class="ic" style="--ic:${c.paid?'var(--pos)':'var(--warn)'}" aria-hidden="true">${c.paid?'✓':c.pk}</div>
    <button class="mid" style="border:0;background:none;padding:0;text-align:left" data-act="editcc" data-id="${c.id}"><div class="t">${c.pk} of ${c.pn}</div>
    <div class="m">${c.paid?`Paid ${dLabel(ccPaidDate(c))}${c.direct?' by '+esc(c.lo):''}`:c.due?`Charged ${dLabel(c.d)}`:`Charged ${dLabel(c.d)} · no due date`}</div>${c.due&&!c.paid?dueTag(c.due):''}</button>
    <div class="r stack"><b>${peso(c.a)}</b>${cardOwed(c)>0?`<button class="btn sm" data-act="ccback" data-id="${c.id}">Paid back</button>`:''}${c.paid?`<button class="btn sm" data-act="unpay" data-id="${c.id}" data-from="plan">Paid ✓</button>`:`<button class="btn sm" data-act="paycc" data-id="${c.id}" data-from="plan">Mark paid</button>`}</div></div>`).join('')}</div>
  <div class="btns" style="margin-top:12px"><button class="btn" data-act="editcc" data-id="${(open[0]||f).id}">Edit</button><button class="btn danger" data-act="plandel" data-id="${id}">Delete plan</button><button class="btn" data-act="close">Close</button></div>`)}
function summaryLine(){const st=monthStats(STATE.m);return`For ${pLabel(STATE.m)} you are at <b class="${st.net<0?'neg':'pos'}">${peso(st.net)}</b> net.`}
function trendRows(){const cur=curP(),end=STATE.m>cur?STATE.m:cur;
  const ms=S.tx.map(t=>periodOf(t.d)).concat(S.cc.map(c=>periodOf(c.d))).sort();
  let start=ms[0]&&ms[0]<end?ms[0]:end;if(addM(start,11)<end)start=addM(end,-11);if(start>STATE.m)start=STATE.m;
  let h='';// newest first; past months only (no empty future rows). Tap a row to open that month.
  for(let m=end;m>=start;m=addM(m,-1)){const st=monthStats(m),e=pE(m),wt=sumBal(balances(e)),cl=ccUnpaid(e);
    h+=`<tr class="${m===STATE.m?'on':''}" data-act="setm" data-id="${m}"><td>${pShort(m)}</td><td class="pos">${pesoS(st.in)}</td><td>${pesoS(st.exp)}</td><td>${pesoS(st.lent)}</td><td>${pesoS(st.out)}</td><td class="${st.net<0?'neg':st.net>0?'pos':''}">${pesoS(st.net)}</td><td class="warn">${pesoS(cl)}</td><td class="${wt<0?'neg':''}">${pesoS(wt)}</td></tr>`}
  return h}
function dayGroups(shown,all){const spent={};all.forEach(t=>{if(t.t==='exp'||t.t==='card')spent[t.d]=(spent[t.d]||0)+t.a});let h='',last='';
  for(const t of shown){if(t.d!==last){last=t.d;h+=`<div class="dayhead"><span>${dayName(t.d)}</span>${spent[t.d]?`<span class="mono">${peso(spent[t.d])} spent</span>`:''}</div>`}h+=txRow(t,true)}return h}
function txRow(t,noDate){const T={exp:[catCol(t.c),catIc(t.c),t.s,catName(t.c),'-'],inc:['var(--pos)','+',t.s,t.k||'Income','+'],
  xfer:['var(--muted)','⇄',t.s||`${W(t.w).name} → ${W(t.to).name}`,`${W(t.w).name} → ${W(t.to).name}`,''],lend:['var(--owed)','↗',`Lent to ${t.p}`,t.s||'Loan','-'],
  repay:['var(--pos)','↙',`${t.p} paid back`,'Repayment','+'],ccpay:['var(--warn)','▭',t.s||'Card payment','Card payment','-'],
  card:[catCol(t.c),catIc(t.c),t.s,`${catName(t.c)}${t.plan?` · ${t.pk} of ${t.pn}`:''} · ${t.card}`,'']}[t.t];
  const cls=T[4]==='+'?'pos':T[4]==='-'&&t.t!=='exp'?'neg':'';
  return`<button class="item" data-act="${t.t==='card'?'editcc':'edit'}" data-id="${t.id}"><div class="ic" style="--ic:${T[0]}" aria-hidden="true">${esc(T[1])}</div><div class="mid"><div class="t">${esc(T[2])}</div><div class="m">${noDate?'':dLabel(t.d)+' · '}${esc(T[3])}${t.t!=='xfer'&&t.t!=='card'?' · '+esc(W(t.w).name):''}${t.n?' · '+esc(t.n):''}${t.tags?' · <span class="tagtxt">'+esc(tagStr(t.tags))+'</span>':''}</div></div><div class="r"><b class="${cls}">${T[4]}${peso(t.a)}</b></div></button>`}

/* ================= sheets & forms ================= */
// Sheets slide up and slide away. kind says what is showing ('settings' lets Settings refresh itself in place);
// anim 'fwd'/'back' slides between Settings pages.
const sheetOpen=()=>!$('#sheet').hidden&&!$('#sheet').classList.contains('closing');
function sheet(html,kind,anim){clearTimeout(sheet.t);const w=$('#sheet'),b=$('#sheetBody'),was=sheetOpen();
  w.classList.remove('closing');b.innerHTML=html;STATE.sheetKind=kind||'';w.hidden=false;
  b.classList.remove('pg-fwd','pg-back');if(was&&anim&&!REDUCED){void b.offsetWidth;b.classList.add('pg-'+anim);$('.sheet',w).scrollTop=0}
  const f=$('#sheetBody input:not([type=hidden]):not([data-nofocus]),#sheetBody select');if(f&&!was&&!('ontouchstart' in window))f.focus()}
function closeSheet(){const w=$('#sheet');if(w.hidden||w.classList.contains('closing'))return;STATE.sheetKind='';w.classList.add('closing');
  clearTimeout(sheet.t);sheet.t=setTimeout(()=>{w.hidden=true;w.classList.remove('closing');$('#sheetBody').innerHTML=''},REDUCED?0:230)}
const refreshSettings=()=>{if(sheetOpen()&&STATE.sheetKind==='settings')settings()};
function toast(msg,act,label){const t=$('#toast');t.innerHTML=esc(msg)+(act?` <button class="tact" data-act="${act}">${esc(label)}</button>`:'');
  t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),act?6000:2400)}
function askConfirm(msg,yes,label='Delete'){sheet(`<h3>${esc(msg)}</h3><div class="btns"><button class="btn pri" id="cyes" style="background:var(--neg);border-color:var(--neg)">${esc(label)}</button><button class="btn" data-act="close">Cancel</button></div>`);$('#cyes').onclick=()=>{closeSheet();yes()}}
const wOpts=sel=>S.wallets.filter(w=>!w.hidden||w.id===sel).map(w=>`<option value="${w.id}"${w.id===sel?' selected':''}>${w.ic?esc(w.ic)+' ':''}${esc(w.name)}</option>`).join('');
const defDate=()=>{const t=today();return inP(t,STATE.m)?t:pE(STATE.m)<=t?addDays(pE(STATE.m),-1):pS(STATE.m)};

function addMenu(){sheet(`<h3>Add a record</h3><div class="actions-grid">
  ${[['exp','Expense','−','var(--c2)'],['inc','Income','+','var(--pos)'],['xfer','Transfer','⇄','var(--muted)'],['lend','Lend cash','↗','var(--owed)'],['cc','Card charge','▭','var(--warn)'],['ai','Type it','✦','var(--accent)']]
   .map(([t,l,i,c])=>`<button class="act" data-act="${t==='ai'?'tab':'form'}" data-t="${t}" data-id="ai"><i style="background:${c}">${i}</i>${l}</button>`).join('')}</div>
  ${S.cfg.shortcuts.length?`<p class="eyebrow" style="margin:16px 0 8px">Quick add</p><div class="chips">${S.cfg.shortcuts.map(q=>`<button class="chip sc" data-act="ask" data-q="${esc(q)}">⚡ ${esc(q)}</button>`).join('')}</div>`:''}`)}

/* Amount field with a calculator: type a sum (120+45) or open the keypad. The result shows under the field and is what gets saved. */
const CALC_IC='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="3"/><path d="M8.5 6.5h7v3h-7z"/><path class="k" d="M8.8 13.2h.01M12 13.2h.01M15.2 13.2h.01M8.8 17h.01M12 17h.01M15.2 17h.01"/></svg>';
const KEYS=[['C','fn'],['del','fn','⌫'],['%','op'],['÷','op'],['7'],['8'],['9'],['×','op'],['4'],['5'],['6'],['−','op'],['1'],['2'],['3'],['+','op'],['00'],['0'],['.'],['=','eq']];
const amtField=(v,label)=>`<div class="field amtf"><label class="flabel" for="f_a">${label||'Amount'} (${esc(CUR())})</label>
  <div class="amtrow"><input class="amtin" id="f_a" inputmode="decimal" placeholder="${DEC()?'0.00':'0'}" value="${v}" required autocomplete="off" aria-describedby="f_calc">

const people=()=>[...new Set([...S.tx.filter(t=>t.p).map(t=>t.p),...S.cc.filter(c=>c.lo).map(c=>c.lo)])];

function openForm(type,x={}){const ed=!!x.id;const d=x.d||defDate();let body='',title='';

  if(type==='inc'){title=ed?'Edit income':'Add income';body=amt+`<label>Source<input id="f_s" value="${esc(x.s||'')}" placeholder="e.g. Salary, freelance client" required></label>
    <div class="row2"><label>Type<select id="f_k">${[...new Set([...S.incTypes,...(x.k&&!S.incTypes.includes(x.k)?[x.k]:[])])].map(k=>`<option${k===(x.k||S.incTypes[0])?' selected':''}>${esc(k)}</option>`).join('')}</select></label><label>Deposited to<select id="f_w">${wOpts(x.w||wid('gcash'))}</select></label></div>`+date+note}
  if(type==='xfer'){title=ed?'Edit transfer':'Transfer between wallets';body=amt+`<div class="row2"><label>From<select id="f_w">${wOpts(x.w||wid('gcash'))}</select></label><label>To<select id="f_to">${wOpts(x.to||wid('cash'))}</select></label></div>`+date+note}
  if(type==='lend'){title=ed?'Edit loan':'Lend cash';const ppl=people();
    body=`<label>Who borrowed<input id="f_p" list="ppl" value="${esc(x.p||'')}" placeholder="e.g. Mama, Kuya" required><datalist id="ppl">${ppl.map(p=>`<option value="${esc(p)}">`).join('')}</datalist></label>`+amt+
    `<label>Reason<input id="f_s" value="${esc(x.s||'')}" placeholder="Optional"></label><div class="row2"><label>Taken from<select id="f_w">${wOpts(x.w||wid('gcash'))}</select></label>${date}</div><label>Due date<input type="date" id="f_due" value="${x.due||''}"></label>`+note}
  if(type==='repay'){const l=S.tx.find(t=>t.id===x.ref),cc=!l&&S.cc.find(c=>c.id===x.ref);
    const left=l?loans().find(z=>z.id===l.id).owed+(ed?x.a:0):cc?cardOwed(cc)+(ed?x.a:0):0;title=`Repayment from ${esc(x.p||(l&&l.p)||(cc&&cc.lo)||'')}`;
    body=amtField(x.a!=null?x.a:left)+`<div class="sub">${cc?`For “${esc(cc.s)}”${cc.plan?` (${cc.pk} of ${cc.pn})`:''} on your ${esc(cc.card)}. `:''}Still owed before this: ${peso(left)}</div><div class="row2"><label>Received in<select id="f_w">${wOpts(x.w||(l&&l.w)||wid('cash'))}</select></label>${date}</div>`}
  if(type==='cc'){const pl=ed&&x.plan,pn=!ed&&x.pn>1?x.pn:1;title=pl?`Edit month ${x.pk} of ${x.pn}`:ed?'Edit card charge':'Add card charge';
    body=amt+`<label>Merchant or item<input id="f_s" value="${esc(x.s||'')}" placeholder="e.g. Shopee rice cooker" required autocomplete="off"></label>`+catPick(x.c||'')+
    `<div class="row2"><label>Card<select id="f_card">${S.cards.map(c=>`<option${c===x.card?' selected':''}>${esc(c)}</option>`).join('')}</select></label>${pl?date.replace('>Date<','>Charged on<'):date}</div>
    <div class="field"><span class="flabel" id="f_byl">Who used the card?</span><div class="chips" id="f_by" role="group" aria-labelledby="f_byl">
      <button type="button" class="chip${x.lo?'':' on'}" data-by="me" aria-pressed="${!x.lo}">Me</button><button type="button" class="chip${x.lo?' on':''}" data-by="lo" aria-pressed="${!!x.lo}">Someone borrowed it</button></div>
      <label id="f_low"${x.lo?'':' hidden'}>Their name<input id="f_lo" list="ppl" value="${esc(x.lo||'')}" placeholder="e.g. Kuya, Ate Joy" autocomplete="off"><datalist id="ppl">${people().map(p=>`<option value="${esc(p)}">`).join('')}</datalist></label>
      <span class="sub" id="f_lohint">${x.lo?LOHINT:''}</span></div>`+
    (pl?`<div class="sub">Part of ${peso(x.pa)} in ${x.pn} monthly payments${x.pr?` at ${x.pr}% a month`:''}, bought ${dLabel(x.pd||x.d)}. The name, card, category and who used it change for every month; the amount and dates change for this month only.</div>`
    :ed?'':`<div class="field"><span class="flabel" id="f_pnl">Pay in</span><div class="chips" id="f_pns" role="group" aria-labelledby="f_pnl">${PNS.map(([v,l])=>{const on=v===pn||(v===0&&![1,3,6,12].includes(pn));return`<button type="button" class="chip${on?' on':''}" data-pn="${v}" aria-pressed="${on}">${l}</button>`}).join('')}</div>
      <div class="row2" id="f_planrow"${pn>1?'':' hidden'}><label>Months<input id="f_pn" inputmode="numeric" value="${pn>1?pn:''}" placeholder="e.g. 9" autocomplete="off"></label><label>Interest a month (%)<input id="f_pr" inputmode="decimal" placeholder="0" autocomplete="off"></label></div>
      <div class="planprev" id="f_plan" aria-live="polite"></div></div>`)+
    `<label><span id="f_duel">${pn>1?'First due date':'Due date'}</span><input type="date" id="f_due" value="${x.due||(ed?'':dueFor(x.card||S.cards[0],d))}"></label><div class="sub" id="f_duehint"></div>`+note}
  if(type!=='repay')body+=`<label>Tags<input id="f_tags" value="${esc(tagStr(x.tags))}" placeholder="#family #trip" autocomplete="off" autocapitalize="off"></label>`;
  if(!ed&&['exp','inc','xfer','cc'].includes(type))body+=`<label id="f_repl"${type==='cc'&&x.pn>1?' hidden':''}>Repeat<select id="f_rep"><option value="">Doesn’t repeat</option><option value="week"${x.every==='week'?' selected':''}>Every week</option><option value="month"${x.every==='month'?' selected':''}>Every month</option></select></label>`;
  sheet(`<h3>${title}</h3><form class="form" id="txform">${body}<div class="btns" style="margin-top:4px"><button class="btn pri" type="submit" style="flex:1">${ed?'Save changes':'Save'}</button>${ed?`<button class="btn danger" type="button" id="f_del">Delete</button>`:''}<button class="btn" type="button" data-act="close">Cancel</button></div></form>`);
  if(type==='exp'||type==='cc'){let manual=!!x.c;const hint=$('#f_hint'),cin=$('#f_c');
    const pick=id=>{cin.value=id;document.querySelectorAll('#f_cats .chip').forEach(b=>b.classList.toggle('on',b.dataset.cat===id))};
    $('#f_cats').onclick=e=>{const b=e.target.closest('[data-cat]');if(b){manual=true;pick(b.dataset.cat);hint.textContent=''}};
    let tm;$('#f_s').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{const p=predict(e.target.value);if(!p){hint.textContent='';return}
      const alt=p.alts.slice(1).filter(a=>a.p>=.12);
       hint.innerHTML=`✦ ${esc(catName(p.c))} · ${Math.round(p.p*100)}% sure · ${esc(p.why)}`+(alt.length?' · or '+alt.map(a=>`<button type="button" class="alt" data-cat="${a.c}">${esc(catName(a.c))}</button>`).join(', '):'');
      if(!manual)pick(p.c)},120)};
    hint.onclick=e=>{const b=e.target.closest('[data-cat]');if(b){manual=true;pick(b.dataset.cat);hint.textContent=''}}}
  if(type==='cc'){let manual=!!x.due&&ed;const due=$('#f_due'),hint=$('#f_duehint');
    const fill=()=>{if(manual)return;const v=dueFor($('#f_card').value,$('#f_d').value);due.value=v;const c=S.cardCfg[$('#f_card').value];
      hint.textContent=v?`Due date from ${$('#f_card').value}: statement on the ${ord(c.close||0)}${c.close?'':' (not set)'}, due on the ${ord(c.due)}.`:'Set this card’s statement and due days in Settings › Cards to fill this in.'};
    due.oninput=()=>{manual=true;hint.textContent=''};$('#f_card').onchange=fill;$('#f_d').onchange=fill;if(!ed)fill();
    const seg=(box,b)=>box.querySelectorAll('.chip').forEach(z=>{z.classList.toggle('on',z===b);z.setAttribute('aria-pressed',z===b)});
    $('#f_by').onclick=e=>{const b=e.target.closest('[data-by]');if(!b)return;seg($('#f_by'),b);const lo=b.dataset.by==='lo';
      $('#f_low').hidden=!lo;$('#f_lohint').textContent=lo?LOHINT:'';if(lo)$('#f_lo').focus()};
    const pnIn=$('#f_pn');if(pnIn){const prIn=$('#f_pr'),prev=$('#f_plan'),row=$('#f_planrow');
      const upd=()=>{const n=Math.round(num(pnIn.value))||1,on=!row.hidden&&n>1,a=amtVal($('#f_a').value),r=Math.max(0,num(prIn.value)||0);
        $('#f_duel').textContent=on?'First due date':'Due date';$('#f_repl').hidden=on;
        if(!on||!(a>0)){prev.innerHTML=on?'Enter the price above to see the monthly amount.':'';return}
        const p=planAmounts(a,n,r),dv=$('#f_due').value;
        prev.innerHTML=`<b>${peso(p.each)}</b> a month × ${n}${p.last!==p.each?` (last month ${peso(p.last)})`:''} = <b>${peso(p.total)}</b>${r?` · ${peso(p.total-a)} interest`:''}${dv?`<br>Due ${dLabel(dv)}, ${dv.slice(0,4)} to ${dLabel(addMonths(dv,n-1))}, ${addMonths(dv,n-1).slice(0,4)}`:''}`};
      $('#f_pns').onclick=e=>{const b=e.target.closest('[data-pn]');if(!b)return;seg($('#f_pns'),b);const v=+b.dataset.pn;row.hidden=v===1;pnIn.value=v>1?v:'';if(v===0)pnIn.focus();upd()};
      pnIn.oninput=()=>{const n=Math.round(num(pnIn.value));const b=$(`#f_pns [data-pn="${[3,6,12].includes(n)?n:0}"]`);seg($('#f_pns'),b);upd()};
      prIn.oninput=upd;$('#f_a').addEventListener('input',upd);due.addEventListener('input',upd);due.addEventListener('change',upd);$('#f_card').addEventListener('change',upd);$('#f_d').addEventListener('change',upd);upd()}}
  if(ed)$('#f_del').onclick=()=>delRecord(type,x);
  $('#txform').onsubmit=e=>{e.preventDefault();const a=amtVal($('#f_a').value);if(!(a>0)){toast(CALC_OPS.test($('#f_a').value)?'That sum does not add up to an amount. Check the numbers.':'Enter an amount above zero.');return}
    const g=id=>{const el=$('#'+id);return el?el.value.trim():undefined};
    const rep_=g('f_rep'),tags=parseTags(g('f_tags'));let newRec=null;const setTags=o=>{if(tags.length)o.tags=tags;else delete o.tags};
    if(type==='cc'){const byLo=$('#f_by .chip.on').dataset.by==='lo',lo=byLo?g('f_lo'):'';if(byLo&&!lo){toast('Enter the name of who used your card.');$('#f_lo').focus();return}
      if(!g('f_c')){const p=predict(g('f_s'));$('#f_c').value=p&&p.p>.3?p.c:fallbackCat()}
      const setLo=o=>{if(lo)o.lo=lo;else delete o.lo};const f={a,s:g('f_s'),c:g('f_c'),card:g('f_card'),d:g('f_d'),due:g('f_due'),n:g('f_n')};
      if(ed){const c=S.cc.find(z=>z.id===x.id);Object.assign(c,f);setLo(c);setTags(c);
        if(c.plan)planItems(c.plan).forEach(o=>{if(o!==c){Object.assign(o,{s:c.s,c:c.c,card:c.card,n:c.n});setLo(o);setTags(o)}})}
      else{const pnIn=$('#f_pn'),n=pnIn&&!$('#f_planrow').hidden?Math.round(num(pnIn.value)):1;if(pnIn&&!$('#f_planrow').hidden&&!(n>1)){toast('Enter how many months, 2 or more.');pnIn.focus();return}
        const base={...f};if(lo)base.lo=lo;if(tags.length)base.tags=tags;const made=addCardCharge(base,n,Math.max(0,num(g('f_pr'))||0));
        if(n>1){save();closeSheet();render();toast(`Added ${made.length} monthly payments of ${peso(made[0].a)}`);return}newRec=made[0]}}
    else{if(type==='xfer'&&g('f_w')===g('f_to')){toast('Pick two different wallets.');return}
      if(type==='exp'&&!g('f_c')){const p=predict(g('f_s'));$('#f_c').value=p?p.c:fallbackCat()}
      const t=ed?S.tx.find(z=>z.id===x.id):own({id:uid(),t:type});
      Object.assign(t,{a,d:g('f_d'),w:g('f_w')});
      for(const[k,id]of[['s','f_s'],['c','f_c'],['k','f_k'],['to','f_to'],['p','f_p'],['due','f_due'],['n','f_n']]){const v=g(id);if(v!==undefined)t[k]=v}
      if(type==='repay'){t.ref=x.ref;t.p=x.p}else setTags(t);
      if(!ed){S.tx.push(t);newRec=t}}
    if(rep_&&newRec&&!S.demo)addRule(type,newRec,rep_);
    save();closeSheet();render();if(rep_&&!S.demo&&runRecurring())return;
    const bc=type==='exp'||(type==='cc'&&!(newRec||x).lo)?catOf(g('f_c')):null,bb=bc&&bc.budget>0?budgets(STATE.m).find(x=>x.c.id===bc.id):null;
    toast((ed?'Saved':'Added')+(bb?` · ${bc.name}: ${peso(bb.spent)} of ${peso(bb.limit)}`:''))}}

/* Removing card items also removes their payment records and the paybacks from whoever borrowed the card. */
function dropCc(ids){const set=new Set(ids),pays=new Set(S.cc.filter(c=>set.has(c.id)&&c.pay).map(c=>c.pay));
  snapshot('delete');S.tx=S.tx.filter(t=>!pays.has(t.id)&&!((t.t==='ccpay'||t.t==='repay')&&set.has(t.ref)));S.cc=S.cc.filter(c=>!set.has(c.id));save();render();toast('Deleted',S.demo?'':'undo','Undo')}
function delPlan(id){const it=planItems(id);if(!it.length)return;
  askConfirm(`Delete all ${it.length} months of “${it[0].s}”? Payments logged for them are removed too.`,()=>dropCc(it.map(c=>c.id)),'Delete plan')}
function delRecord(type,x){
  if(type==='cc'&&x.plan){sheet(`<h3>Delete “${esc(x.s)}”?</h3><p class="sub" style="margin:0 0 14px">This is month ${x.pk} of ${x.pn} of an installment plan.</p><div class="btns" style="flex-direction:column;align-items:stretch">
    <button class="btn pri" id="cplan" style="background:var(--neg);border-color:var(--neg)">Delete the whole plan</button><button class="btn" id="cone">Only this month</button><button class="btn" data-act="close">Cancel</button></div>`);
    $('#cplan').onclick=()=>{closeSheet();dropCc(planItems(x.plan).map(c=>c.id))};$('#cone').onclick=()=>{closeSheet();dropCc([x.id])};return}
  if(type==='cc')return askConfirm(`Delete “${x.s}”?`,()=>dropCc([x.id]));
  const extra=type==='lend'?S.tx.filter(t=>t.ref===x.id).length:0;
  askConfirm(type==='lend'&&extra?`Delete this loan and its ${extra} repayment${extra>1?'s':''}?`:'Delete this record?',()=>{
    snapshot('delete');S.tx=S.tx.filter(t=>t.id!==x.id&&!(type==='lend'&&t.ref===x.id));
    if(type==='ccpay'){const c=S.cc.find(c=>c.pay===x.id);if(c){c.paid=false;delete c.pay}}
    save();render();toast('Deleted',S.demo?'':'undo','Undo')})}

/* Paying the bank for a card item. When someone borrowed the card, they may have paid the bank themselves: then nothing
   leaves my wallets and they owe me nothing for it. back: reopen the installment plan afterwards. */
function payCard(c,back){const lo=c.lo,owe=cardOwed(c);
  sheet(`<h3>Pay “${esc(c.s)}”${c.plan?` · ${c.pk} of ${c.pn}`:''}</h3><form class="form" id="payform"><div class="kv"><span>Amount</span><b class="mono">${peso(c.a)}</b></div>
  ${lo?`<div class="field"><span class="flabel" id="p_byl">Who paid the bank?</span><div class="chips" id="p_by" role="group" aria-labelledby="p_byl"><button type="button" class="chip on" data-by="me" aria-pressed="true">I did</button><button type="button" class="chip" data-by="lo" aria-pressed="false">${esc(lo)} did</button></div></div>`:''}
  <div class="row2"><label id="p_wl">Paid from<select id="p_w">${wOpts(wid('gcash'))}</select></label><label>Date<input type="date" id="p_d" value="${defDate()}"></label></div>
  ${lo?`<div class="sub" id="p_hint">${owe>0?`${esc(lo)} still owes you ${peso(owe)} for this. Tap Paid back when they pay you.`:''}</div>`:''}
  <div class="btns"><button class="btn pri" type="submit" style="flex:1">Mark paid</button><button class="btn" type="button" data-act="close">Cancel</button></div></form>`);
  let by='me';if(lo)$('#p_by').onclick=e=>{const b=e.target.closest('[data-by]');if(!b)return;by=b.dataset.by;
    $('#p_by').querySelectorAll('.chip').forEach(z=>{z.classList.toggle('on',z===b);z.setAttribute('aria-pressed',z===b)});$('#p_wl').hidden=by==='lo';
    $('#p_hint').textContent=by==='lo'?`${lo} paid it straight to the bank, so nothing leaves your wallets and they owe you nothing for it.`:owe>0?`${lo} still owes you ${peso(owe)} for this. Tap Paid back when they pay you.`:''};
  $('#payform').onsubmit=e=>{e.preventDefault();const d=$('#p_d').value||today();
    if(by==='lo'){c.paid=true;c.direct=1;c.paidOn=d;delete c.pay}
    else{const t=own({id:uid(),t:'ccpay',a:c.a,d,w:$('#p_w').value,ref:c.id,s:'Paid card: '+c.s+(c.plan?` (${c.pk} of ${c.pn})`:'')});S.tx.push(t);c.paid=true;c.pay=t.id;delete c.direct;delete c.paidOn}
    save();render();if(back)planSheet(c.plan);else closeSheet();toast(c.plan&&!planItems(c.plan).some(x=>!x.paid)?'Paid off. That was the last month.':'Marked paid')}}
