<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style><title>Pitaka</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pitaka">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* Inter is bundled with the app (fonts/, SIL Open Font License), so it works offline and nothing is fetched from other sites. */
@font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-latin-ext.woff2) format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
/* Layout: phone-first single column (max 560px), translucent bar on top, translucent tab bar at bottom, sheets slide up for every form.
   Look: iOS-inspired. Grouped gray background, white rounded cards without borders, hairline separators, capsule buttons, frosted bars. */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --surface-2:#efeff4; --line:rgba(60,60,67,.18); --fg:#000000; --muted:#6c6c70;
  --accent:#0066cc; --accent-fill:#0071e3; --accent-fg:#ffffff; --accent-soft:#e3eefc;
  --pos:#1a7f37; --pos-soft:#e2f4e6; --neg:#d70015; --neg-soft:#fde7e9;
  --warn:#b25000; --warn-soft:#fff0db; --owed:#5348c8; --owed-soft:#ebeafb;
  --c1:#34c759; --c2:#007aff; --c3:#ff3b30; --c4:#af52de; --c5:#ff9500; --c6:#30b0c7; --c7:#ffcc00; --c8:#ff2d55;
  --bar:rgba(242,242,247,.8); --shadow:0 8px 24px rgba(0,0,0,.16);
  --font-display:"Inter", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
  --font-body:var(--font-display);
  --font-data:var(--font-display);
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --line:rgba(84,84,88,.65); --fg:#ffffff; --muted:#98989f;
  --accent:#4da3ff; --accent-fill:#0071e3; --accent-fg:#ffffff; --accent-soft:#0e2a4a;
  --pos:#30d158; --pos-soft:#0e2e17; --neg:#ff6961; --neg-soft:#3b1513; --warn:#ff9f0a; --warn-soft:#3a2606; --owed:#9d9bff; --owed-soft:#1f1e45;
  --c1:#30d158; --c2:#0a84ff; --c3:#ff453a; --c4:#bf5af2; --c5:#ff9f0a; --c6:#40c8e0; --c7:#ffd60a; --c8:#ff375f;
  --bar:rgba(22,22,24,.78); --shadow:0 8px 24px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --line:rgba(84,84,88,.65); --fg:#ffffff; --muted:#98989f;
  --accent:#4da3ff; --accent-fill:#0071e3; --accent-fg:#ffffff; --accent-soft:#0e2a4a;
  --pos:#30d158; --pos-soft:#0e2e17; --neg:#ff6961; --neg-soft:#3b1513; --warn:#ff9f0a; --warn-soft:#3a2606; --owed:#9d9bff; --owed-soft:#1f1e45;
  --c1:#30d158; --c2:#0a84ff; --c3:#ff453a; --c4:#bf5af2; --c5:#ff9f0a; --c6:#40c8e0; --c7:#ffd60a; --c8:#ff375f;
  --bar:rgba(22,22,24,.78); --shadow:0 8px 24px rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-body);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono,.amt{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)} .owed{color:var(--owed)} .muted{color:var(--muted)}

/* frosted top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:8px}
.brand{display:flex;align-items:center;gap:8px;font:700 17px/1 var(--font-display);letter-spacing:-.02em}
.brand i{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:linear-gradient(180deg,#3d9bff,#0066cc);color:#fff;font-style:normal;font-size:16px;font-weight:700}
.month{margin-left:auto;display:flex;align-items:center;gap:0;background:var(--surface-2);border-radius:999px;padding:2px}
.month b{font:600 15px/1 var(--font-display);min-width:80px;text-align:center}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border:0;background:none;border-radius:999px;color:var(--accent)}
.icon-btn:active{opacity:.5}
.icon-btn svg,.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

main.wrap{padding-block:4px 160px;display:flex;flex-direction:column;gap:16px}
.ltitle{font:700 34px/1.15 var(--font-display);letter-spacing:-.03em;margin:10px 0 -4px}

/* grouped cards */
.card{background:var(--surface);border-radius:var(--r);padding:16px;min-width:0}
.card h2{font:600 17px/1.2 var(--font-display);letter-spacing:-.02em;margin:0 0 10px;display:flex;align-items:center;gap:8px;text-wrap:balance}
.card h2 .right{margin-left:auto;font:400 13px var(--font-body);color:var(--muted)}
.eyebrow{font-size:13px;font-weight:500;color:var(--muted);margin:0 0 4px}
.big{font:700 28px/1.1 var(--font-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.sub{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
.rows{display:flex;flex-direction:column;gap:7px;margin-top:12px;padding-top:12px;border-top:.5px solid var(--line);font-size:14px}
.rows div{display:flex;justify-content:space-between;gap:8px}
.rows div b{font:500 14px var(--font-data);font-variant-numeric:tabular-nums;white-space:nowrap}

.notice{border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.notice b{font:600 15px var(--font-display);letter-spacing:-.01em}
.notice.bad{background:var(--neg-soft)}
.notice.warn{background:var(--warn-soft)}
.notice.good{background:var(--pos-soft)}
.notice.info{background:var(--accent-soft)}
.notice .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.notice .btn:not(.pri){background:var(--surface)}
.notice a{color:var(--accent);font-weight:600}

.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.brk{display:flex;flex-direction:column;gap:14px}
.brk .lbl{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:6px}
.brk .lbl b{font:500 13.5px var(--font-data);font-variant-numeric:tabular-nums;white-space:nowrap}

/* capsule buttons: gray-filled by default, blue-filled for the main action */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--surface-2);color:var(--accent);border-radius:999px;padding:10px 16px;min-height:40px;font-size:15px;font-weight:600}
.btn.pri{background:var(--accent-fill);color:var(--accent-fg)}
.btn.sm{padding:6px 13px;font-size:13.5px;min-height:34px}
.btn.danger{color:var(--neg)}
.btn:active{opacity:.6}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
.pill.neg{background:var(--neg-soft)} .pill.pos{background:var(--pos-soft)} .pill.warn{background:var(--warn-soft)} .pill.zero{background:var(--surface-2);color:var(--muted)} .pill.owed{background:var(--owed-soft)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}

/* table (trend only) */
.tscroll{overflow-x:auto;margin-inline:-16px;padding-inline:16px}
table{border-collapse:collapse;width:100%;font:13px var(--font-data);font-variant-numeric:tabular-nums}
th{font:500 12px var(--font-body);color:var(--muted);text-align:right;padding:6px 8px;white-space:nowrap;border-bottom:.5px solid var(--line)}
td{text-align:right;padding:9px 8px;white-space:nowrap;border-bottom:.5px solid var(--line)}
th:first-child,td:first-child{text-align:left;font-family:var(--font-body);font-weight:600}
tr:last-child td{border-bottom:0}
tr.on td{background:var(--accent-soft)}
tbody tr{cursor:pointer}

/* wallets */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.wcard .head{display:flex;align-items:center;gap:8px;font-weight:600}
.wcard .head .pill{margin-left:auto}

/* inset list rows: separators start after the icon, like iOS lists */
.list{display:flex;flex-direction:column}
.item{position:relative;display:flex;align-items:center;gap:12px;padding:11px 0;border:0;background:none;text-align:left;width:100%}
.item+.item::before{content:"";position:absolute;top:0;left:48px;right:0;border-top:.5px solid var(--line)}
.item .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font:600 15px var(--font-display);flex:none;background:color-mix(in srgb,var(--ic) 18%,var(--surface));color:color-mix(in srgb,var(--ic) 45%,var(--fg))}
.item .mid{flex:1;min-width:0}
.item .t{font-weight:500;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .r{text-align:right;flex:none}
.item .r b{font:500 15px var(--font-data);font-variant-numeric:tabular-nums;display:block}
.item .r small{font-size:12px;color:var(--muted)}
.empty{padding:18px 4px;text-align:center;color:var(--muted);font-size:14px}

/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--surface-2);border-radius:99px;padding:6px 13px;min-height:34px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.chip.on{background:var(--accent-fill);color:var(--accent-fg)}
.search{width:100%;border:0;background:var(--surface-2);border-radius:10px;padding:9px 12px;font-size:16px}
.search::placeholder{color:var(--muted)}

/* donut */
.donut{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:460px){.donut{grid-template-columns:1fr;justify-items:center;gap:12px}}
.donut svg{width:150px;height:150px;max-width:100%}
.donut circle{cursor:pointer}
.legend{display:flex;flex-direction:column;gap:0;width:100%;min-width:0}
.legend button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:7px 0;min-height:36px;text-align:left;font-size:15px;min-width:0;width:100%}
.legend button+button{border-top:.5px solid var(--line)}
.legend button span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend button b{font:500 14px var(--font-data);font-variant-numeric:tabular-nums;white-space:nowrap}
.legend button.dim{opacity:.4}

/* frosted tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:11px;font-weight:500;color:var(--muted)}
.tab.on{color:var(--accent)}
.fab{position:fixed;z-index:7;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(72px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent-fill);color:var(--accent-fg);font-size:30px;font-weight:300;line-height:1;box-shadow:var(--shadow)}
.fab:active{transform:scale(.94)}
@media (min-width:600px){.fab{right:calc(50% - 280px + 16px)}}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.sheet{position:relative;width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:14px 14px 0 0;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:36px;height:5px;border-radius:9px;background:color-mix(in srgb,var(--muted) 45%,transparent);margin:2px auto 12px}
.sheet h3{font:700 22px var(--font-display);letter-spacing:-.02em;margin:0 0 14px}
.form{display:flex;flex-direction:column;gap:14px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--muted)}
.form input,.form select,.form textarea{border:0;background:var(--surface-2);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--fg);width:100%;min-width:0}
.form .amtin{font:600 30px var(--font-data);font-variant-numeric:tabular-nums;letter-spacing:-.02em;padding:8px 12px}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .row2>label{min-width:0}
.hint{font-size:13px;color:var(--accent);font-weight:500;min-height:17px}
.hint .alt{border:0;background:none;padding:0;color:inherit;font:inherit;text-decoration:underline;text-underline-offset:2px}
.flabel{font-size:13px;font-weight:500;color:var(--muted)}
.actions-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.act{border:0;background:var(--surface-2);border-radius:14px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:500}
.act i{font-style:normal;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:600 18px var(--font-display);color:#fff}

/* assistant: message bubbles */
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;padding:9px 13px;border-radius:19px;font-size:15px;line-height:1.45}
.msg.me{align-self:flex-end;background:var(--accent-fill);color:var(--accent-fg);border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--surface);border-bottom-left-radius:6px}
.msg.bot ul{margin:6px 0 0;padding-left:18px}
.msg.bot li{margin:3px 0}
.msg .draft{margin-top:10px;padding:12px;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.msg .draft .chip{background:var(--surface)}
.msg .draft .chip.on{background:var(--accent-fill)}
.msg .draft .btns{margin-top:2px}
.ai-head{display:flex;gap:12px;align-items:center}
.ai-head .orb{width:40px;height:40px;border-radius:50%;background:linear-gradient(180deg,#3d9bff,#0066cc);color:#fff;display:grid;place-items:center;font:600 19px var(--font-display);flex:none}
.composer{position:fixed;left:0;right:0;bottom:calc(54px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line)}
.composer .wrap{padding-block:8px;display:flex;flex-direction:column;gap:8px}
.composer form{display:flex;gap:8px}
.composer input{flex:1;min-width:0;border:.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font-size:16px}
.composer .chip{background:var(--surface)}
.composer .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.composer .chips::-webkit-scrollbar{display:none}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:30;background:rgba(28,28,30,.92);color:#fff;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.split{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cv{content-visibility:auto;contain-intrinsic-size:auto 400px}
/* home hero */
.hero .big{font-size:36px}
.grid2 .big{font-size:23px;overflow-wrap:anywhere}
.grid2 .rows,.grid2 .rows div b{font-size:13.5px}
.hero-k{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px;padding-top:12px;border-top:.5px solid var(--line)}
.hero-k button{border:0;background:none;padding:0;text-align:left;min-width:0}
.hero-k span{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.hero-k b{display:block;font:600 15px/1.3 var(--font-data);font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
/* day groups in the transaction list */
.dayhead{display:flex;justify-content:space-between;gap:8px;padding:16px 0 4px;font-size:13px;font-weight:600;color:var(--muted)}
.dayhead:first-child{padding-top:4px}
.due{font-size:13px;font-weight:500;margin-top:2px}
</style>

</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><i>₱</i>Pitaka</div>
  <div class="month">
    <button class="icon-btn" data-act="month" data-k="-1" aria-label="Previous month"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <b id="mlabel"></b>
    <button class="icon-btn" data-act="month" data-k="1" aria-label="Next month"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
  <button class="icon-btn" data-act="settings" aria-label="Settings and backup"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>

const STOP=new Set('the a an and or for to at in on of my ko sa ng na po with from via using paid pay bayad php peso pesos at ang mga si ni kay para papunta pauwi going home new bagong'.split(' '));
const stem=w=>w.length>4&&/ies$/.test(w)?w.slice(0,-3)+'y':w.length>4&&/[^su]s$/.test(w)?w.slice(0,-1):w;
const words=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/(\w)'s\b/g,'$1').replace(/[.'’]/g,'')
  .replace(/\bs&r\b/g,'snr').replace(/\bj&t\b/g,'jnt').replace(/\bh&m\b/g,'hm').replace(/(\w)-(?=\w)/g,'$1') // x-ray, halo-halo, pag-ibig, 7-eleven
  .replace(/[^a-z0-9+]+/g,' ').split(' ').filter(w=>w.length>1&&!/^\d+(kg|g|ml|l|pcs|x)?$/.test(w))
  .map(w=>stem(w.length>4?w.replace(/(.)\1{2,}/g,'$1$1'):w));
/* Place and people words ("to work", "for mama") say little about the category, so they count less. */
const WEAK=new Set('work office trabaho opisina school eskwela bahay house mall friends family barkada mama papa kuya ate bunso anak lola lolo tita tito'.split(' '));
const tok=s=>{const ws=words(s).filter(w=>!STOP.has(w));const out=[...ws];for(let i=0;i<ws.length-1;i++)out.push(ws[i]+'_'+ws[i+1]);return out};
const seedTok=p=>p.split('_').map(stem).join('_');
/* Typo tolerance: "jolibee" ≈ "jollibee", "grocerries" ≈ "grocery". Damerau distance, stopping early once too far. */
function editDist(a,b,max){if(Math.abs(a.length-b.length)>max)return max+1;let p2=null,p=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){const c=[i];let lo=i;for(let j=1;j<=b.length;j++){const x=a[i-1]===b[j-1]?0:1;
    let v=Math.min(p[j]+1,c[j-1]+1,p[j-1]+x);if(p2&&i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])v=Math.min(v,p2[j-2]+1);c[j]=v;if(v<lo)lo=v}
    if(lo>max)return max+1;p2=p;p=c}return p[b.length]}
let MODEL=null;
function model(){if(MODEL)return MODEL;
  const M={cnt:{},tot:{},udocs:{},uN:0,V:new Set(),exact:{},fz:{}};
  const add=(c,ws,w)=>{const cc=M.cnt[c]=M.cnt[c]||{};for(const t of ws){cc[t]=(cc[t]||0)+w;M.tot[c]=(M.tot[c]||0)+w;M.V.add(t)}};
  for(const c in SEED)add(c,SEED[c].split(/\s+/).filter(Boolean).map(seedTok),1);
  // Your own entries count 4x a seed word, so the app learns your habits (and your corrections) quickly.
  for(const t of S.tx)if(t.t==='exp'&&t.s){add(t.c,tok(t.s),4);M.udocs[t.c]=(M.udocs[t.c]||0)+1;M.uN++;M.exact[words(t.s).join(' ')]=t.c}
  M.list=[...M.V].filter(v=>!v.includes('_'));
  return MODEL=M}
function fuzzy(M,w){if(w in M.fz)return M.fz[w];let best=null,bd=9;
  if(w.length>=4&&!w.includes('_')){const max=w.length>=8?2:1;
    for(const v of M.list){if(v.length<3)continue;let d=w.length>=5?editDist(w,v,max):max+1; // short words: too many real words sit one letter apart (loan/load)
      if(d>max&&v.length>=4&&(w.startsWith(v)&&w.length-v.length<=3||v.startsWith(w)&&v.length-w.length<=3))d=max; // groc → grocery, gasolina → gasoline
      if(d<=max&&(d<bd||d===bd&&best&&v.length>best.length)){bd=d;best=v}}}
  return M.fz[w]=best}
function predict(text){
  const M=model(),k=words(text).join(' ');if(!k)return null;
  if(M.exact[k])return{c:M.exact[k],p:.99,why:'Same as a past entry',alts:[{c:M.exact[k],p:.99}]};
  // A known two-word phrase ("yellow cab", "mercury drug") replaces its single words.
  const all=tok(text),pairs=all.filter(w=>w.includes('_')&&M.V.has(w)),covered=new Set(pairs.flatMap(w=>w.split('_')));
  const ws=[],hits=[];
  for(const w of pairs){ws.push(w);hits.push(w.replace(/_/g,' '))}
  for(const w of all){if(w.includes('_')||covered.has(w))continue;
    if(M.V.has(w)){ws.push(w);hits.push(w)}else{const f=fuzzy(M,w);if(f&&!ws.includes(f)){ws.push(f);hits.push(w+' ≈ '+f)}}}
  if(!ws.length)return null;
  const V=M.V.size,K=CATS.length,A=.02,sc={};let mx=-Infinity;
  for(const{id}of CATS){const cc=M.cnt[id]||{},tot=M.tot[id]||0;
    let s=Math.log(((M.udocs[id]||0)+2)/(M.uN+2*K));for(const w of ws)s+=(WEAK.has(w)?.35:1)*Math.log(((cc[w]||0)+A)/(tot+V*A));sc[id]=s;if(s>mx)mx=s}
  let z=0;for(const id in sc){sc[id]=Math.exp(sc[id]-mx);z+=sc[id]}
  const alts=Object.keys(sc).sort((a,b)=>sc[b]-sc[a]).slice(0,3).map(c=>({c,p:sc[c]/z}));
  return{c:alts[0].c,p:alts[0].p,why:'Matched “'+hits.slice(0,3).join(', ')+'”',alts}}

  <div class="hero-k"><button data-act="tab" data-id="spend"><span>Net ${cur?'this month':mLabel(m).slice(0,3)}</span><b class="${st.net<0?'neg':'pos'}">${st.net>0.004?'+':''}${peso(st.net)}</b></button>
  <button data-act="tab" data-id="debts"><span>Cards unpaid</span><b class="warn">${peso(ccUnpaid(end))}</b></button>
  <button data-act="tab" data-id="debts"><span>Owed to me</span><b class="owed">${peso(owedTotal(end))}</b></button></div></section>`}

const VIEWS={
home(){const m=STATE.m,st=monthStats(m),end=nextM(m)+'-01',ins=insights(m);
  const gw=W(S.goal.w),gb=balances(end)[S.goal.w]||0,gp=Math.max(0,Math.min(1,gb/(S.goal.amt||1)));
  const outs=[['Money lent to others',st.lent,'var(--c3)'],['Day-to-day expenses',st.exp,'var(--c2)'],['Card & SPayLater paid',st.ccp,'var(--c4)']];
  const mx=Math.max(st.out,st.ccCharged,1);
  return`<h1 class="ltitle">Overview</h1>`+updateNotice()+installNotice()+(S.demo?`<div class="notice info"><b>You are viewing sample data</b><span>Explore freely, then start with your own numbers. Sample entries are examples, not your records.</span><div class="acts"><button class="btn sm pri" data-act="fresh">Start fresh</button><button class="btn sm" data-act="settings">Set wallet balances</button></div></div>`:'')+
  hero()+
  (ins.length?`<div class="notice ${ins[0].lv}"><b>${esc(ins[0].t)}</b><span>${esc(ins[0].x)}</span><div class="acts"><button class="btn sm" data-act="ask" data-q="Give me tips">Get tips</button><button class="btn sm" data-act="ask" data-q="forecast">Forecast</button>${ins.length>1?`<button class="btn sm" data-act="insall" aria-expanded="${!!STATE.insAll}">${STATE.insAll?'Hide':'See'} ${ins.length-1} more</button>`:''}</div></div>`:'')+
  (STATE.insAll?ins.slice(1).map(n=>`<div class="notice ${n.lv}"><b>${esc(n.t)}</b><span>${esc(n.x)}</span></div>`).join(''):'')+
  `<div class="grid2">
    <section class="card"><p class="eyebrow">Cash in</p><div class="big pos">${peso(st.in)}</div><div class="rows"><div><span>Income</span><b>${peso(st.inc)}</b></div><div><span>Paid back</span><b>${peso(st.rep)}</b></div></div></section>
    <section class="card"><p class="eyebrow">Cash out</p><div class="big">${peso(st.out)}</div><div class="rows"><div><span>Spending</span><b>${peso(st.exp)}</b></div><div><span>Lent out</span><b class="neg">${peso(st.lent)}</b></div><div><span>Cards</span><b>${peso(st.ccp)}</b></div></div></section>
  </div>
  <section class="card"><div class="split"><p class="eyebrow">Savings goal · ${esc(gw.name)}</p><span class="sub mono">Goal ${peso(S.goal.amt)}</span></div>
    <div class="big">${peso(gb)}</div><div class="bar" style="margin-top:10px"><i style="width:${gp*100}%;background:var(--accent)"></i></div>
    <div class="split sub" style="margin-top:6px"><span>${Math.round(gp*100)}% reached</span><span class="mono">${gb>=S.goal.amt?'Goal reached':'Remaining '+peso(S.goal.amt-gb)}</span></div></section>
  <section class="card"><h2>Where the cash went</h2><div class="brk">
    ${outs.map(([l,v,c])=>`<div><div class="lbl"><span>${l}</span><b>${peso(v)} · ${pct(v,st.out)}</b></div><div class="bar"><i style="width:${v/mx*100}%;background:${c}"></i></div></div>`).join('')}
    <div><div class="lbl"><span>Charged to cards <span class="sub">(debt, not cash)</span></span><b class="warn">${peso(st.ccCharged)}</b></div><div class="bar"><i style="width:${st.ccCharged/mx*100}%;background:var(--warn)"></i></div></div>
  </div></section>
  <section class="card cv"><h2>Month by month</h2><div class="tscroll"><table><thead><tr><th>Month</th><th>Income</th><th>Spent</th><th>Lent</th><th>Out</th><th>Net</th><th>Cards left</th><th>Wallets</th></tr></thead><tbody>${trendRows()}</tbody></table></div></section>`},

wallets(){const m=STATE.m,start=m+'-01',end=nextM(m)+'-01',open=balances(start);const flows={};
  S.wallets.forEach(w=>flows[w.id]={in:0,out:0,xf:0});
  const xfers=[];for(const t of S.tx){if(t.d<start||t.d>=end)continue;const f=flows[t.w]||(flows[t.w]={in:0,out:0,xf:0});
    if(t.t==='inc'||t.t==='repay')f.in+=t.a;else if(t.t==='xfer'){f.xf-=t.a;(flows[t.to]||(flows[t.to]={in:0,out:0,xf:0})).xf+=t.a;xfers.push(t)}else f.out+=t.a}
  const close=balances(end),tot=sumBal(close);
  return`<h1 class="ltitle">Wallets</h1><section class="notice ${tot<0?'bad':'info'}"><span class="eyebrow">All wallets combined</span><span class="big ${tot<0?'neg':''}">${peso(tot)}</span><span class="sub">Opened at ${peso(sumBal(open))}, with ${peso(monthStats(m).in)} in and ${peso(monthStats(m).out)} out.</span></section>
  <div class="split"><h2 style="font:600 20px var(--font-display);letter-spacing:-.02em;margin:0">Wallets at month end</h2><button class="btn sm pri" data-act="form" data-t="xfer">Transfer</button></div>
  <div class="wgrid">${S.wallets.map(w=>{const c=close[w.id]||0,f=flows[w.id];const st=c<-0.004?['neg','Overdrawn']:c>0.004?['pos','Positive']:['zero','Zero'];
    return`<section class="card wcard"><div class="head"><span class="dot" style="background:var(--c${w.col})"></span>${esc(w.name)}<span class="pill ${st[0]}">${st[1]}</span></div>
    <div class="big ${c<0?'neg':''}" style="margin-top:8px">${peso(c)}</div>
    ${!(open[w.id]||0)&&!f.in&&!f.out&&!f.xf?`<div class="sub" style="margin-top:6px">No activity this month.</div>`:
    `<div class="rows"><div><span>Opening</span><b>${peso(open[w.id]||0)}</b></div><div><span>Money in</span><b class="pos">+${peso(f.in)}</b></div><div><span>Money out</span><b class="neg">-${peso(f.out)}</b></div><div><span>Net transfers</span><b>${peso(f.xf)}</b></div></div>`}</section>`}).join('')}</div>
  <section class="card"><h2>Transfers between wallets<span class="right">${xfers.length} this month</span></h2><div class="list">
    ${xfers.length?xfers.sort((a,b)=>b.d.localeCompare(a.d)).map(t=>txRow(t)).join(''):'<div class="empty">No transfers this month. Transfers move money between wallets without changing your totals.</div>'}</div></section>`},

spend(){const m=STATE.m,st=monthStats(m),F=STATE.filter;const cats=CATS.filter(c=>st.cats[c.id]).sort((a,b)=>st.cats[b.id]-st.cats[a.id]);
  let acc=0;const arcs=cats.map(c=>{const p=st.cats[c.id]/(st.exp||1)*100;const s=`<circle r="15.915" cx="21" cy="21" fill="none" stroke="${catCol(c.id)}" stroke-width="6" stroke-dasharray="${Math.max(0,p-.4)} ${100-Math.max(0,p-.4)}" stroke-dashoffset="${25-acc}" data-act="cat" data-id="${c.id}" opacity="${F.cat&&F.cat!==c.id?.3:1}"><title>${c.name}</title></circle>`;acc+=p;return s}).join('');
  let list=S.tx.filter(t=>t.d.slice(0,7)===m);
  if(F.type!=='all')list=list.filter(t=>F.type==='loan'?(t.t==='lend'||t.t==='repay'):t.t===F.type);
  if(F.cat)list=list.filter(t=>t.t==='exp'&&t.c===F.cat);
  if(F.q){const q=F.q.toLowerCase();list=list.filter(t=>((t.s||'')+' '+(t.n||'')+' '+(t.p||'')+' '+W(t.w).name).toLowerCase().includes(q))}
  list.sort((a,b)=>b.d.localeCompare(a.d));const shown=list.slice(0,F.limit);
  return`<h1 class="ltitle">Spending</h1><section class="card"><h2>Spending by category<span class="right">${st.n} entries</span></h2>
    ${st.exp?`<div class="donut"><svg viewBox="0 0 42 42" role="img" aria-label="Category donut chart"><circle r="15.915" cx="21" cy="21" fill="none" stroke="var(--surface-2)" stroke-width="6"/>${arcs}
      <text x="21" y="20" text-anchor="middle" font-size="3" fill="var(--muted)" font-family="var(--font-body)">Total</text><text x="21" y="24.5" text-anchor="middle" font-size="4.2" font-weight="700" fill="var(--fg)" font-family="var(--font-display)">${pesoS(st.exp)}</text></svg>
      <div class="legend">${cats.map(c=>`<button data-act="cat" data-id="${c.id}" class="${F.cat&&F.cat!==c.id?'dim':''}"><i class="dot" style="background:${catCol(c.id)}"></i><span>${c.name}</span><b>${pesoS(st.cats[c.id])} · ${pct(st.cats[c.id],st.exp)}</b></button>`).join('')}</div></div>`
      :'<div class="empty">No expenses this month yet. Tap + to add one, or tell the assistant “lunch 120 gcash”.</div>'}</section>
  <section class="card"><h2>Transactions${F.cat?`<span class="pill zero">${catName(F.cat)}</span>`:''}<span class="right">${list.length} shown</span></h2>
    <div style="display:flex;flex-direction:column;gap:10px"><input class="search" id="search" type="search" placeholder="Search description, person, wallet" value="${esc(F.q)}" aria-label="Search transactions">
    <div class="chips">${[['all','All'],['exp','Expenses'],['inc','Income'],['xfer','Transfers'],['loan','Loans'],['ccpay','Card payments']].map(([k,l])=>`<button class="chip${F.type===k?' on':''}" data-act="type" data-id="${k}">${l}</button>`).join('')}${F.cat?`<button class="chip" data-act="cat" data-id="${F.cat}">Clear category ✕</button>`:''}</div></div>
    <div class="list" style="margin-top:6px">${shown.length?dayGroups(shown,list):'<div class="empty">Nothing matches.</div>'}</div>
    ${list.length>shown.length?`<button class="btn" style="width:100%;margin-top:8px" data-act="more">Show ${Math.min(40,list.length-shown.length)} more</button>`:''}</section>`},

debts(){const end=nextM(STATE.m)+'-01',L=loans(),open=ccOpen();const owed=sum(L,l=>l.owed),people=new Set(L.filter(l=>l.owed>0).map(l=>l.p)).size;
  const byCard={};open.forEach(c=>byCard[c.card]=(byCard[c.card]||0)+c.a);
  const ccList=S.cc.slice().sort((a,b)=>(a.paid-b.paid)||(a.due||'9').localeCompare(b.due||'9'));
  return`<h1 class="ltitle">Debts</h1><div class="grid2">
    <section class="card"><p class="eyebrow">Owed to me</p><div class="big owed">${peso(owed)}</div><div class="sub">${people} ${people===1?'person':'people'} · lent this month ${peso(monthStats(STATE.m).lent)}</div></section>
    <section class="card"><p class="eyebrow">What I owe</p><div class="big neg">${peso(sum(open))}</div><div class="sub">${Object.keys(byCard).map(k=>esc(k)+' '+pesoS(byCard[k])).join(' · ')||'All paid'}</div></section></div>
  <section class="card"><div class="split" style="margin-bottom:6px"><h2 style="margin:0">Money I lent</h2><button class="btn sm pri" data-act="form" data-t="lend">Lend cash</button></div>
    <div class="list">${L.length?L.map(l=>`<div class="item"><div class="ic" style="--ic:var(--owed)" aria-hidden="true">${esc((l.p||'?').charAt(0).toUpperCase())}</div>
      <button class="mid" style="border:0;background:none;padding:0;text-align:left" data-act="edit" data-id="${l.id}"><div class="t">${esc(l.p)}${l.s?` <span class="muted" style="font-weight:400">· ${esc(l.s)}</span>`:''}</div>
      <div class="m">${dLabel(l.d)} · ${esc(W(l.w).name)} · lent ${peso(l.a)}${l.paid?` · repaid ${peso(l.paid)}`:''}</div>${l.due&&l.owed>0?dueTag(l.due):''}</button>
      <div class="r">${l.owed>0?`<b class="neg">${peso(l.owed)}</b><button class="btn sm" data-act="repay" data-id="${l.id}" style="margin-top:4px">Repaid</button>`:`<span class="pill pos">Settled</span>`}</div></div>`).join(''):'<div class="empty">No loans yet. When family or friends borrow, log it here so you remember.</div>'}</div></section>
  <section class="card"><div class="split" style="margin-bottom:6px"><h2 style="margin:0">Card & SPayLater items</h2><button class="btn sm pri" data-act="form" data-t="cc">Add charge</button></div>
    <div class="list">${ccList.length?ccList.map(c=>`<div class="item"><div class="ic" style="--ic:var(--warn)" aria-hidden="true">${c.card.charAt(0)}</div>
      <button class="mid" style="border:0;background:none;padding:0;text-align:left" data-act="editcc" data-id="${c.id}"><div class="t">${esc(c.s)}</div><div class="m">${esc(c.card)} · ${dLabel(c.d)} · for ${esc(c.who||'Me')}</div>${c.due&&!c.paid?dueTag(c.due):''}</button>
      <div class="r"><b>${peso(c.a)}</b>${c.paid?`<button class="btn sm" data-act="unpay" data-id="${c.id}" style="margin-top:4px">Paid ✓</button>`:`<button class="btn sm" data-act="paycc" data-id="${c.id}" style="margin-top:4px">Mark paid</button>`}</div></div>`).join(''):'<div class="empty">No card charges logged.</div>'}</div></section>`},

ai(){if(!STATE.chat.length)STATE.chat.push({me:false,h:`<b>Hi! I am your on-device assistant.</b> `+summaryLine()+`<br><br>`+help()});
  return`<h1 class="ltitle">Assistant</h1><section class="ai-head"><div class="orb" aria-hidden="true">✦</div><div><div class="sub">Runs offline on your phone. No internet, no GPU, no data leaves the device.</div></div></section>
  <div class="chat" id="chat">${STATE.chat.map((c,i)=>`<div class="msg ${c.me?'me':'bot'}">${c.me?esc(c.h):c.h}${c.draft!=null?draftCard(c.draft):''}</div>`).join('')}</div><div style="height:96px"></div>`}};

function summaryLine(){const st=monthStats(STATE.m);return`For ${mLabel(STATE.m)} you are at <b class="${st.net<0?'neg':'pos'}">${peso(st.net)}</b> net.`}
function trendRows(){const cur=today().slice(0,7),end=STATE.m>cur?STATE.m:cur;
  const ms=S.tx.map(t=>t.d.slice(0,7)).concat(S.cc.map(c=>c.d.slice(0,7))).sort();
  let start=ms[0]&&ms[0]<end?ms[0]:end;if(addM(start,11)<end)start=addM(end,-11);if(start>STATE.m)start=STATE.m;
  let h='';// newest first; past months only (no empty future rows). Tap a row to open that month.
  for(let m=end;m>=start;m=addM(m,-1)){const st=monthStats(m),e=nextM(m)+'-01',wt=sumBal(balances(e)),cl=ccUnpaid(e);
    h+=`<tr class="${m===STATE.m?'on':''}" data-act="setm" data-id="${m}"><td>${mLabel(m)}</td><td class="pos">${pesoS(st.in)}</td><td>${pesoS(st.exp)}</td><td>${pesoS(st.lent)}</td><td>${pesoS(st.out)}</td><td class="${st.net<0?'neg':st.net>0?'pos':''}">${pesoS(st.net)}</td><td class="warn">${pesoS(cl)}</td><td class="${wt<0?'neg':''}">${pesoS(wt)}</td></tr>`}
  return h}
function dayGroups(shown,all){const spent={};all.forEach(t=>{if(t.t==='exp')spent[t.d]=(spent[t.d]||0)+t.a});let h='',last='';
  for(const t of shown){if(t.d!==last){last=t.d;h+=`<div class="dayhead"><span>${dayName(t.d)}</span>${spent[t.d]?`<span class="mono">${peso(spent[t.d])} spent</span>`:''}</div>`}h+=txRow(t,true)}return h}
function txRow(t,noDate){const T={exp:[catCol(t.c),catName(t.c).charAt(0),t.s,catName(t.c),'-'],inc:['var(--pos)','+',t.s,t.k||'Income','+'],
  xfer:['var(--muted)','⇄',t.s||`${W(t.w).name} → ${W(t.to).name}`,`${W(t.w).name} → ${W(t.to).name}`,''],lend:['var(--owed)','↗',`Lent to ${t.p}`,t.s||'Loan','-'],
  repay:['var(--pos)','↙',`${t.p} paid back`,'Repayment','+'],ccpay:['var(--warn)','▭',t.s||'Card payment','Card payment','-']}[t.t];
  const cls=T[4]==='+'?'pos':T[4]==='-'&&t.t!=='exp'?'neg':'';
  return`<button class="item" data-act="edit" data-id="${t.id}"><div class="ic" style="--ic:${T[0]}" aria-hidden="true">${esc(T[1])}</div><div class="mid"><div class="t">${esc(T[2])}</div><div class="m">${noDate?'':dLabel(t.d)+' · '}${esc(T[3])}${t.t!=='xfer'?' · '+esc(W(t.w).name):''}${t.n?' · '+esc(t.n):''}</div></div><div class="r"><b class="${cls}">${T[4]}${peso(t.a)}</b></div></button>`}

/* ================= sheets & forms ================= */
function sheet(html){$('#sheetBody').innerHTML=html;$('#sheet').hidden=false;const f=$('#sheetBody input:not([type=hidden]),#sheetBody select');if(f&&!('ontouchstart' in window))f.focus()}
function closeSheet(){$('#sheet').hidden=true;$('#sheetBody').innerHTML=''}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2200)}
function askConfirm(msg,yes,label='Delete'){sheet(`<h3>${esc(msg)}</h3><div class="btns"><button class="btn pri" id="cyes" style="background:var(--neg);border-color:var(--neg)">${esc(label)}</button><button class="btn" data-act="close">Cancel</button></div>`);$('#cyes').onclick=()=>{closeSheet();yes()}}
const wOpts=sel=>S.wallets.map(w=>`<option value="${w.id}"${w.id===sel?' selected':''}>${esc(w.name)}</option>`).join('');
const defDate=()=>{const t=today();return t.slice(0,7)===STATE.m?t:(STATE.m<t.slice(0,7)?STATE.m+'-'+pad(dim(STATE.m)):STATE.m+'-01')};

function addMenu(){sheet(`<h3>Add a record</h3><div class="actions-grid">
  ${[['exp','Expense','−','var(--c2)'],['inc','Income','+','var(--pos)'],['xfer','Transfer','⇄','var(--muted)'],['lend','Lend cash','↗','var(--owed)'],['cc','Card charge','▭','var(--warn)'],['ai','Type it','✦','var(--accent)']]
   .map(([t,l,i,c])=>`<button class="act" data-act="${t==='ai'?'tab':'form'}" data-t="${t}" data-id="ai"><i style="background:${c}">${i}</i>${l}</button>`).join('')}</div>`)}

function openForm(type,x={}){const ed=!!x.id;const d=x.d||defDate();let body='',title='';
  const amt=`<label>Amount (₱)<input class="amtin" id="f_a" inputmode="decimal" placeholder="0.00" value="${x.a!=null?x.a:''}" required></label>`;
  const date=`<label>Date<input type="date" id="f_d" value="${d}" required></label>`;
  const note=`<label>Note<input id="f_n" value="${esc(x.n||'')}" placeholder="Optional"></label>`;
  if(type==='exp'){title=ed?'Edit expense':'Add expense';const c=x.c||'';
    body=amt+`<label>What was it for?<input id="f_s" value="${esc(x.s||'')}" placeholder="e.g. Jollibee lunch, jeep to work" required autocomplete="off"></label><div class="hint" id="f_hint"></div>
    <div class="flabel" id="f_catl">Category</div><div class="chips" id="f_cats" role="group" aria-labelledby="f_catl" style="margin-top:-6px">${CATS.map(k=>`<button type="button" class="chip${k.id===c?' on':''}" data-cat="${k.id}"><i class="dot" style="background:${catCol(k.id)}"></i>${k.name}</button>`).join('')}</div>
    <input type="hidden" id="f_c" value="${c}"><div class="row2"><label>Paid from<select id="f_w">${wOpts(x.w||'cash')}</select></label>${date}</div>`+note}
  if(type==='inc'){title=ed?'Edit income':'Add income';body=amt+`<label>Source<input id="f_s" value="${esc(x.s||'')}" placeholder="e.g. Salary, freelance client" required></label>
    <div class="row2"><label>Type<select id="f_k">${['Salary','Freelance','Bonus','Allowance','Gift','Refund','Other'].map(k=>`<option${k===(x.k||'Salary')?' selected':''}>${k}</option>`).join('')}</select></label><label>Deposited to<select id="f_w">${wOpts(x.w||'gcash')}</select></label></div>`+date+note}
  if(type==='xfer'){title=ed?'Edit transfer':'Transfer between wallets';body=amt+`<div class="row2"><label>From<select id="f_w">${wOpts(x.w||'gcash')}</select></label><label>To<select id="f_to">${wOpts(x.to||'cash')}</select></label></div>`+date+note}
  if(type==='lend'){title=ed?'Edit loan':'Lend cash';const ppl=[...new Set(S.tx.filter(t=>t.p).map(t=>t.p))];
    body=`<label>Who borrowed<input id="f_p" list="ppl" value="${esc(x.p||'')}" placeholder="e.g. Mama, Kuya" required><datalist id="ppl">${ppl.map(p=>`<option value="${esc(p)}">`).join('')}</datalist></label>`+amt+
    `<label>Reason<input id="f_s" value="${esc(x.s||'')}" placeholder="Optional"></label><div class="row2"><label>Taken from<select id="f_w">${wOpts(x.w||'gcash')}</select></label>${date}</div><label>Due date<input type="date" id="f_due" value="${x.due||''}"></label>`+note}
  if(type==='repay'){const l=S.tx.find(t=>t.id===x.ref);const left=l?loans().find(z=>z.id===l.id).owed+(ed?x.a:0):0;title=`Repayment from ${esc(x.p||(l&&l.p)||'')}`;
    body=amt.replace(`value="${x.a!=null?x.a:''}"`,`value="${x.a!=null?x.a:left}"`)+`<div class="sub">Still owed before this: ${peso(left)}</div><div class="row2"><label>Received in<select id="f_w">${wOpts(x.w||(l&&l.w)||'cash')}</select></label>${date}</div>`}
  if(type==='cc'){title=ed?'Edit card charge':'Add card charge';body=amt+`<label>Merchant or item<input id="f_s" value="${esc(x.s||'')}" placeholder="e.g. Shopee rice cooker" required></label>
    <div class="row2"><label>Card<select id="f_card">${S.cards.map(c=>`<option${c===x.card?' selected':''}>${esc(c)}</option>`).join('')}</select></label><label>For who<input id="f_who" value="${esc(x.who||'Me')}"></label></div>
    <div class="row2">${date}<label>Due date<input type="date" id="f_due" value="${x.due||''}"></label></div>`+note}
  sheet(`<h3>${title}</h3><form class="form" id="txform">${body}<div class="btns" style="margin-top:4px"><button class="btn pri" type="submit" style="flex:1">${ed?'Save changes':'Save'}</button>${ed?`<button class="btn danger" type="button" id="f_del">Delete</button>`:''}<button class="btn" type="button" data-act="close">Cancel</button></div></form>`);
  if(type==='exp'){let manual=!!x.c;const hint=$('#f_hint'),cin=$('#f_c');
    const pick=id=>{cin.value=id;document.querySelectorAll('#f_cats .chip').forEach(b=>b.classList.toggle('on',b.dataset.cat===id))};
    $('#f_cats').onclick=e=>{const b=e.target.closest('[data-cat]');if(b){manual=true;pick(b.dataset.cat);hint.textContent=''}};
    let tm;$('#f_s').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{const p=predict(e.target.value);if(!p){hint.textContent='';return}
      const alt=p.alts.slice(1).filter(a=>a.p>=.12);
      hint.innerHTML=`✦ ${catName(p.c)} · ${Math.round(p.p*100)}% sure · ${esc(p.why)}`+(alt.length?' · or '+alt.map(a=>`<button type="button" class="alt" data-cat="${a.c}">${catName(a.c)}</button>`).join(', '):'');
      if(!manual)pick(p.c)},120)};
    hint.onclick=e=>{const b=e.target.closest('[data-cat]');if(b){manual=true;pick(b.dataset.cat);hint.textContent=''}}}
  if(ed)$('#f_del').onclick=()=>delRecord(type,x);
  $('#txform').onsubmit=e=>{e.preventDefault();const a=num($('#f_a').value);if(!(a>0)){toast('Enter an amount above zero.');return}
    const g=id=>{const el=$('#'+id);return el?el.value.trim():undefined};
    if(type==='cc'){const c=ed?S.cc.find(z=>z.id===x.id):{id:uid(),paid:false};Object.assign(c,{a,s:g('f_s'),card:g('f_card'),who:g('f_who'),d:g('f_d'),due:g('f_due'),n:g('f_n')});if(!ed)S.cc.push(c)}
    else{if(type==='xfer'&&g('f_w')===g('f_to')){toast('Pick two different wallets.');return}
      if(type==='exp'&&!g('f_c')){const p=predict(g('f_s'));$('#f_c').value=p?p.c:'other'}
      const t=ed?S.tx.find(z=>z.id===x.id):{id:uid(),t:type};
      Object.assign(t,{a,d:g('f_d'),w:g('f_w')});
      for(const[k,id]of[['s','f_s'],['c','f_c'],['k','f_k'],['to','f_to'],['p','f_p'],['due','f_due'],['n','f_n']]){const v=g(id);if(v!==undefined)t[k]=v}
      if(type==='repay'){t.ref=x.ref;t.p=x.p}
      if(!ed)S.tx.push(t)}
    save();closeSheet();render();toast(ed?'Saved':'Added')}}

function delRecord(type,x){
  if(type==='cc')return askConfirm(`Delete “${x.s}”?`,()=>{if(x.pay)S.tx=S.tx.filter(t=>t.id!==x.pay);S.cc=S.cc.filter(c=>c.id!==x.id);save();render();toast('Deleted')});
  const extra=type==='lend'?S.tx.filter(t=>t.ref===x.id).length:0;
  askConfirm(type==='lend'&&extra?`Delete this loan and its ${extra} repayment${extra>1?'s':''}?`:'Delete this record?',()=>{
    S.tx=S.tx.filter(t=>t.id!==x.id&&!(type==='lend'&&t.ref===x.id));
    if(type==='ccpay'){const c=S.cc.find(c=>c.pay===x.id);if(c){c.paid=false;delete c.pay}}
    save();render();toast('Deleted')})}

function payCard(c){sheet(`<h3>Pay “${esc(c.s)}”</h3><form class="form" id="payform"><div class="kv"><span>Amount</span><b class="mono">${peso(c.a)}</b></div>

    S.goal={amt:num($('#g_a').value)||0,w:$('#g_w').value};S.cards=$('#s_cards').value.split(',').map(s=>s.trim()).filter(Boolean);if(!S.cards.length)S.cards=['Credit Card'];

function restore(txt){let d;try{d=JSON.parse(String(txt).trim());if(!d||!Array.isArray(d.tx)||!Array.isArray(d.wallets)||!d.wallets.length)throw 0}
  catch(e){toast('That file is not a Pitaka backup. Pick a file named pitaka-backup.');return}
  const n=d.tx.length+(d.cc||[]).length,when=d.savedAt?` saved ${dLabel(d.savedAt.slice(0,10))}, ${d.savedAt.slice(0,4)}`:'';
  askConfirm(`Replace what is on this phone with this backup (${n} records${when})?`,()=>{delete d.savedAt;S=d;S.cc=S.cc||[];S.cards=S.cards||['Credit Card'];S.goal=S.goal||{amt:0,w:S.wallets[0].id};

/* ================= backup files ================= */
const INSTALLED=!!document.querySelector('link[rel=manifest]')&&!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
function lastBackup(){try{return localStorage.getItem('pitaka.lastbk')||''}catch(e){return''}}
function markBackup(){try{localStorage.setItem('pitaka.lastbk',today())}catch(e){}}
// Android's share menu only accepts certain file types, so the backup travels as .txt (it is JSON inside).
const backupFile=ext=>new File([JSON.stringify({...S,savedAt:new Date().toISOString()},null,ext==='json'?1:0)],`pitaka-backup-${today()}.${ext}`,{type:ext==='json'?'application/json':'text/plain'});
function saveFile(file){try{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);markBackup();return true}catch(e){toast('Download is blocked here. Use Copy backup instead.');return false}}
/* ================= Android app: Pitaka folder ================= */
// Only active inside the native Android build (Capacitor). The web versions skip all of this.
const NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const FS=NATIVE?Capacitor.Plugins.Filesystem:null,SHARE=NATIVE?Capacitor.Plugins.Share:null;
const PHONE={file:'Pitaka/pitaka-data.json',dir:'Pitaka/backups',keep:30,saved:'',err:''};
const phoneData=()=>JSON.stringify({...S,savedAt:new Date().toISOString()},null,1);
let phoneTimer;
function writePhone(now){if(!FS||S.demo)return;clearTimeout(phoneTimer);phoneTimer=setTimeout(async()=>{
  try{const data=phoneData();
    await FS.writeFile({path:PHONE.file,data,directory:'DOCUMENTS',encoding:'utf8',recursive:true});
    await FS.writeFile({path:`${PHONE.dir}/pitaka-${today()}.json`,data,directory:'DOCUMENTS',encoding:'utf8',recursive:true});
    PHONE.saved=new Date().toISOString();PHONE.err='';
    const{files}=await FS.readdir({path:PHONE.dir,directory:'DOCUMENTS'});
    const old=files.map(f=>f.name||f).filter(n=>/^pitaka-\d{4}-\d\d-\d\d\.json$/.test(n)).sort().slice(0,-PHONE.keep);
    for(const n of old)await FS.deleteFile({path:`${PHONE.dir}/${n}`,directory:'DOCUMENTS'}).catch(()=>{});
    if(now)toast('Saved to Documents/Pitaka')}
  catch(e){PHONE.err=String(e&&e.message||e);if(now)toast('Could not write to the Pitaka folder. Check storage permission.')}},now?0:800)}
async function bootPhone(){
  try{const p=await FS.checkPermissions();if(p.publicStorage!=='granted')await FS.requestPermissions()}catch(e){}
  if(!FRESH){writePhone();return}
  // Nothing saved in the app yet (new install or cleared data): pick up the copy in Documents/Pitaka if there is one.
  try{const r=await FS.readFile({path:PHONE.file,directory:'DOCUMENTS',encoding:'utf8'});const d=JSON.parse(r.data);
    if(Array.isArray(d.tx)&&Array.isArray(d.wallets)){delete d.savedAt;S=d;S.cc=S.cc||[];S.cards=S.cards||['Credit Card'];FRESH=false;save();render();toast('Loaded your records from Documents/Pitaka')}}
  catch(e){/* no file yet, or the file belongs to an earlier install: use Restore in Settings */}}
/* ================= app updates (Android app only) ================= */
// Each push to main publishes a GitHub Release with pitaka.apk and version.json. The app compares version numbers,
// downloads the APK, and opens Android's installer. Android only accepts it if it is signed with the same key,
// and records stay in place because the app keeps its storage across updates.
const UPD=NATIVE&&Capacitor.Plugins.AppUpdate?Capacitor.Plugins.AppUpdate:null;
const UPDATE_URL='https://github.com/yoshipaxti/pitaka/releases/latest/download/version.json';
const UP={cur:null,next:null,state:'',pct:-1,later:false,checking:false};
async function checkUpdate(manual){if(!UPD||UP.checking)return;UP.checking=true;
  try{if(!UP.cur)UP.cur=await UPD.info();
    const v=JSON.parse((await UPD.fetchText({url:UPDATE_URL})).text);
    if(!(v&&+v.versionCode>0&&typeof v.apk==='string'))throw new Error('Bad version file');
    UP.next=+v.versionCode>+UP.cur.versionCode?v:null;
    if(manual)toast(UP.next?`Version ${v.versionName} is available`:'You have the latest version')}
  catch(e){if(manual)toast('Could not check for updates. Check your internet connection.')}
  finally{UP.checking=false;render();if(manual&&!$('#sheet').hidden)settings()}}
async function startUpdate(){const v=UP.next;if(!v||UP.state==='dl')return;
  writePhone();UP.state='dl';UP.pct=-1;render();
  const h=await UPD.addListener('progress',e=>{UP.pct=e.percent;const el=$('#updpct');if(el)el.textContent=e.percent>=0?e.percent+'%':''});
  try{await UPD.download({url:v.apk});UP.state='ready';render();await installUpdate()}
  catch(e){UP.state='';render();toast('Download failed. Try again on Wi-Fi.')}
  finally{h.remove()}}
async function installUpdate(){try{await UPD.install()}
  catch(e){toast(e&&e.code==='PERMISSION'?'Turn on “Allow from this source”, then come back and tap Install.':'Could not open the installer.')}}
function updateNotice(){const v=UP.next;if(!v||UP.later)return'';
  const btn=UP.state==='dl'?`<button class="btn sm pri" disabled>Downloading <span id="updpct">${UP.pct>=0?UP.pct+'%':''}</span></button>`
    :UP.state==='ready'?`<button class="btn sm pri" data-act="updinstall">Install</button>`:`<button class="btn sm pri" data-act="update">Update now</button>`;
  return`<div class="notice info"><b>Update available · version ${esc(v.versionName)}</b>${v.notes?`<span>${esc(v.notes)}</span>`:''}<span class="sub">Your records stay on this phone.</span>
  <div class="acts">${btn}${UP.state?'':`<button class="btn sm" data-act="updlater">Later</button>`}</div></div>`}

/* ================= web version: install hint ================= */
// iPhone: records live with the Home Screen app, separate from a Safari tab, so ask people to add it before they start.
const STANDALONE=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
const IOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const ANDROID=/android/i.test(navigator.userAgent);
const APK_URL='https://github.com/yoshipaxti/pitaka/releases/latest/download/pitaka.apk';
function installNotice(){let hide=false;try{hide=localStorage.getItem('pitaka.installhint')==='hide'}catch(e){}
  if(NATIVE||STANDALONE||hide||!(IOS||ANDROID))return'';
  const body=IOS?`Tap the <b>Share</b> button (the square with an arrow), then <b>Add to Home Screen</b>. Open Pitaka from its new icon. Do this before adding records: the Home Screen app keeps its own records, separate from this Safari tab.`
    :`For the full app, <a href="${APK_URL}">download Pitaka for Android</a>. Or use your browser menu, then <b>Add to Home screen</b>.`;
  return`<div class="notice info"><b>${IOS?'Add Pitaka to your Home Screen':'Install Pitaka'}</b><span>${body}</span><div class="acts"><button class="btn sm" data-act="installhide">Got it</button></div></div>`}

async function nativeShare(){const name=`pitaka-backup-${today()}.json`;
  try{await FS.writeFile({path:name,data:phoneData(),directory:'CACHE',encoding:'utf8'});const{uri}=await FS.getUri({path:name,directory:'CACHE'});

  catch(e){if(!/cancel/i.test(String(e&&e.message||e)))toast('Could not open the share menu.')}}

function saveToDrive(){if(NATIVE)return nativeShare();const file=backupFile('txt');
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'Pitaka backup'}).then(()=>{markBackup();if(!$('#sheet').hidden)settings();toast('Backup shared')},
      e=>{if(e&&e.name==='AbortError')return;if(saveFile(file))toast('Saved to Downloads. Upload it in the Drive app.')})}
  else if(saveFile(file))toast('Sharing is not available here. Saved to Downloads; upload it in the Drive app.')}

/* ================= assistant chat ================= */
function draftCard(i){const x=STATE.drafts[i];if(!x)return'';if(x.done)return`<div class="draft"><span class="sub">${x.done}</span></div>`;
  const L={exp:'Expense',inc:'Income',xfer:'Transfer',lend:'Loan',repay:'Repayment',cc:'Card charge'}[x.t];
  const det=x.t==='exp'?`${catName(x.c)} · ${W(x.w).name}`:x.t==='xfer'?`${W(x.w).name} → ${W(x.to).name}`:x.t==='lend'?`to ${x.p} · from ${W(x.w).name}`:x.t==='repay'?`from ${x.p} · into ${W(x.w).name}`:x.t==='cc'?x.card:W(x.w).name;
  const opts=x.t==='exp'?[...new Set([x.c,...(x.conf?x.conf.alts.filter(a=>a.p>=.08).map(a=>a.c):[]),'food','transpo','shop'])].slice(0,4):[];
  const sure=x.conf&&!x.picked?` · ✦ ${Math.round(x.conf.p*100)}% sure of category`:'';
  return`<div class="draft"><div class="split"><b>${L}${x.s&&x.t!=='repay'?': '+esc(x.s):''}</b><b class="mono">${peso(x.a)}</b></div><span class="sub">${esc(det)} · ${dLabel(x.d)}${sure}</span>${x.warn?`<span class="sub warn">${esc(x.warn)}</span>`:''}
  ${opts.length?`<div class="chips" role="group" aria-label="Category">${opts.map(c=>`<button class="chip${c===x.c?' on':''}" data-act="dcat" data-id="${i}" data-c="${c}" aria-pressed="${c===x.c}"><i class="dot" style="background:${catCol(c)}"></i>${catName(c)}</button>`).join('')}</div>`:''}
  <div class="btns"><button class="btn sm pri" data-act="dsave" data-id="${i}">Add it</button><button class="btn sm" data-act="dedit" data-id="${i}">Edit</button><button class="btn sm" data-act="dskip" data-id="${i}">Discard</button></div></div>`}
function renderChips(){$('#aichips').innerHTML=['Summary','Where did my money go?','Who owes me?','Forecast','Tips','Can I afford 2000?','Compare vs last month','Biggest expenses'].map(q=>`<button class="chip" data-act="ask" data-q="${q}">${q}</button>`).join('')}
function ask(text){text=text.trim();if(!text)return;STATE.chat.push({me:true,h:text});
  const isQ=RX.q.test(text.toLowerCase())&&!/^(lunch|dinner|breakfast)/i.test(text);const cmd=isQ?null:parseCommand(text);
  if(cmd){STATE.drafts.push(cmd);const i=STATE.drafts.length-1;
    STATE.chat.push({me:false,h:cmd.t!=='exp'?'Here is what I understood:':!cmd.conf?'I could not tell the category from that. Pick one below:':cmd.conf.p<.6?`My best guess is <b>${catName(cmd.c)}</b> (${esc(cmd.conf.why)}), but I am not sure. Pick another below if it is wrong.`:`Got it. I filed this under <b>${catName(cmd.c)}</b> (${esc(cmd.conf.why)}).`,draft:i})}
  else STATE.chat.push({me:false,h:answer(text)});
  if(STATE.chat.length>60)STATE.chat.splice(1,STATE.chat.length-60);
  if(STATE.tab!=='ai'){STATE.tab='ai'}render()}
function commitDraft(i){const x=STATE.drafts[i];if(!x||x.done)return;
  if(x.t==='cc')S.cc.push({id:uid(),d:x.d,s:x.s,a:x.a,card:x.card,who:x.who||'Me',due:x.due||'',paid:false});
  else{if(x.t==='repay'&&!x.ref){toast('Open the loan in Debts to log this repayment.');return}
    const t={id:uid(),t:x.t,a:x.a,d:x.d,w:x.w};['s','c','k','to','p','ref'].forEach(k=>{if(x[k]!=null&&x[k]!=='')t[k]=x[k]});S.tx.push(t)}
  x.done='Added '+peso(x.a)+'. ✓';save();render()}

  repay:d=>{const l=S.tx.find(x=>x.id===d.id);if(l)openForm('repay',{ref:l.id,p:l.p,w:l.w})},
  paycc:d=>{const c=S.cc.find(x=>x.id===d.id);if(c)payCard(c)},
  unpay:d=>{const c=S.cc.find(x=>x.id===d.id);if(!c)return;askConfirm('Mark as unpaid? The payment record will be removed.',()=>{S.tx=S.tx.filter(t=>t.id!==c.pay);c.paid=false;delete c.pay;save();render()},'Mark unpaid')},
  cat:d=>{STATE.filter.cat=STATE.filter.cat===d.id?null:d.id;if(STATE.filter.cat)STATE.filter.type='all';render()},
  type:d=>{STATE.filter.type=d.id;if(d.id!=='all'&&d.id!=='exp')STATE.filter.cat=null;render()},
  more:()=>{STATE.filter.limit+=40;render()},
  ask:d=>ask(d.q),
  dsave:d=>commitDraft(+d.id),
  dcat:d=>{const x=STATE.drafts[+d.id];if(x&&!x.done){x.c=d.c;x.picked=true;render()}},
  dskip:d=>{const x=STATE.drafts[+d.id];if(x){x.done='Discarded.';render()}},
  dedit:d=>{const x=STATE.drafts[+d.id];if(!x||x.done)return;if(x.t==='repay'&&x.ref)openForm('repay',{ref:x.ref,p:x.p,w:x.w,a:x.a,d:x.d});else openForm(x.t==='repay'?'lend':x.t,{...x,id:undefined});x.done='Opened in the form.'},
  fresh:()=>askConfirm('Erase all records and start fresh?',()=>{const keep=S.demo?null:S.wallets;S=blank();if(keep)S.wallets=keep.map(w=>({...w,init:0}));STATE.chat=[];STATE.drafts=[];save();render();toast('Starting fresh. Set your wallet balances in Settings.')},'Erase'),
  sample:()=>askConfirm('Replace your data with sample data?',()=>{S=demo();STATE.chat=[];save();render()},'Load sample'),
  copybk:()=>{const txt=JSON.stringify(S);const done=()=>toast('Backup copied');
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt));else fallbackCopy(txt)},
  dlbk:()=>{if(saveFile(backupFile('json')))toast('Backup downloaded')},
  drive:()=>saveToDrive(),
  phonesave:()=>writePhone(true),
  update:()=>startUpdate(),updinstall:()=>installUpdate(),updcheck:()=>checkUpdate(true),
  updlater:()=>{UP.later=true;render()},
  installhide:()=>{try{localStorage.setItem('pitaka.installhint','hide')}catch(e){}render()},
  pastebk:()=>restore($('#pastebk').value)};
function fallbackCopy(txt){const ta=$('#pastebk');if(ta){ta.value=txt;ta.select();toast('Selected. Copy it from the box.')}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset,b)}});
let st_;document.addEventListener('input',e=>{if(e.target.id==='search'){clearTimeout(st_);st_=setTimeout(()=>{STATE.filter.q=e.target.value;STATE.filter.limit=40;const pos=e.target.selectionStart;render();const s=$('#search');s.focus();try{s.setSelectionRange(pos,pos)}catch(_){}},180)}});
$('#aiform').onsubmit=e=>{e.preventDefault();const i=$('#aiinput');const v=i.value;i.value='';ask(v)};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});

load();render();
if(NATIVE)bootPhone();
if(UPD)setTimeout(()=>checkUpdate(false),3000);
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if(!NATIVE&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>

</body>
</html>
